[program:exogena-worker]
command=php artisan queue:work database_reports --queue=exogena --timeout=7000 --memory=1024
numprocs=1          ; dos generaciones simultáneas competirían por las mismas tablas
autostart=true
autorestart=true
; El default de la caja de colas es memory_limit=90M; el generador carga en memoria el flujo
; reportable por wallet (62.200 entradas en 2025 contra 4.726 en 2022).
environment=PHP_MEMORY_LIMIT="1G"
