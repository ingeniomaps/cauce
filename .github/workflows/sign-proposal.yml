name: Sign proposal

# Firmar una propuesta era escribir tres líneas a mano —«Estado», «Responsable», «Fecha»— y committearlas.
# El campo `Responsable` es texto libre: lo escribe quien tenga el archivo abierto, y eso incluye a un
# agente. La puerta que exige un responsable comprobaba que **hubiera** un nombre, no de quién era.
#
# Una aprobación de PR sí trae identidad: GitHub la autentica y —esto es lo que la vuelve un guard de
# verdad— **no deja aprobar el propio PR**. «Un cargo no se autoriza a sí mismo» pasa de ser una
# convención escrita a estar impuesto por la plataforma.
#
# Lo que este workflow **no** colapsa: aprobar sigue sin aplicar. La firma autoriza; `agent-promote`
# aplica, y sigue siendo un acto deliberado y aparte. Lo que se junta es publicar la propuesta y
# autorizarla, que eran dos ediciones del mismo archivo hechas por la misma persona con minutos de
# diferencia — y que ya se confundieron una vez.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: sign-proposal-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sign:
    # Sólo una aprobación, y sólo desde una rama de este repositorio: un PR de fork corre con un token
    # recortado y no podría empujar de vuelta, así que fallaría a mitad en vez de no empezar.
    if: >-
      github.event.review.state == 'approved'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `pull_request_review` corre sobre `refs/pull/N/merge`, que no es una rama: sin esto el push
          # no tendría a dónde ir. Se pide la rama del PR, que es la que lleva la propuesta.
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Sign the proposals this pull request carries
        env:
          APPROVER: ${{ github.event.review.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          # `GITHUB_HEAD_REF` está vacío en `pull_request_review` —lo setean `pull_request` y
          # `pull_request_target`, no éste—, así que el push moría en «invalid refspec 'HEAD:'» después de
          # haber firmado y commiteado bien. La rama sale del payload, que es de donde ya salía el checkout.
          BRANCH: ${{ github.event.pull_request.head.ref }}
          # El commit que se aprobó. El checkout trae la rama como está cuando corre el job, no como estaba al
          # aprobar: un push en el medio quedaba firmado sin que nadie lo hubiera visto (caso 486).
          APPROVED: ${{ github.event.review.commit_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp="$(date -u +%Y-%m-%d)"
          # El `login` es la identidad que GitHub autenticó y el nombre es lo que se lee. Van los dos
          # porque responden preguntas distintas: quién firmó esto —que tiene que poder cruzarse contra la
          # aprobación— y quién es esa persona dentro de un año, cuando el `login` haya cambiado o el
          # lector no lo reconozca. El payload de la review sólo trae `login`, así que el nombre cuesta una
          # consulta; una cuenta sin nombre público deja la firma como estaba, con el `login` solo.
          approver_name="$(gh api "users/$APPROVER" --jq '.name // ""' 2>/dev/null || true)"
          # `&`, `/` y `\\` son metacaracteres del reemplazo de `sed`, y un nombre los puede traer.
          signature="$(printf '@%s%s' "$APPROVER" "${approver_name:+ ($approver_name)}" | sed 's/[&/\\]/\\&/g')"
          # Sólo las propuestas que este PR trae, y sólo las que siguen sin firmar. Un PR que no toca
          # ninguna no es un error: la mayoría no lo son, y aprobarlos no tiene que hacer nada.
          pending=""
          for file in $(git diff --name-only "$BASE"...HEAD -- '*/learning/proposals/*.md'); do
            [ -f "$file" ] || continue
            # En «Aprobación humana», como el `sed` de abajo: un fixture firmado puede traer la misma línea.
            awk '/^## Aprobación humana/,0' "$file" | grep -q '^- Estado: pendiente$' && pending="$pending $file"
          done
          if [ -z "$pending" ]; then
            echo "Este PR no trae ninguna propuesta sin firmar; no hay nada que hacer."
            exit 0
          fi
          # Sólo cuando hay algo que firmar: un PR sin propuestas cuya rama se movió no tiene nada que proteger.
          head="$(git rev-parse HEAD)"
          if [ -z "$APPROVED" ] || [ "$head" != "$APPROVED" ]; then
            echo "::error title=No se firmó::Aprobaste ${APPROVED:-un commit que el evento no nombra}, pero la rama ya está en $head. Lo que cambió en el medio nadie lo aprobó: revisalo y volvé a aprobar el PR."
            exit 1
          fi
          signed=""
          for file in $pending; do
            # La huella de lo que se firmó: «Cambio propuesto» y «Evaluación», con sus títulos, cada una hasta el título
            # siguiente fuera de un bloque de código, y nunca más allá de «Aprobación humana», que se reescribe abajo. Con
            # ella `agent-promote` se niega a aplicar lo editado después. Lo replica `fingerprint` en el motor. Un bloque
            # sin cerrar corre los cortes y la huella dejaría afuera lo aprobado, así que no se firma (casos 505 y 506).
            body_file="$(mktemp)"
            if ! awk '/^## Aprobación humana/{exit} /^```/{b=!b} !b && /^## /{f=0; if (/^## Cambio propuesto/ && !c) {f=1; c=1} else if (/^## Evaluación/ && !e) {f=1; e=1}} f; END{exit b}' "$file" > "$body_file" || [ ! -s "$body_file" ]; then
              echo "::error title=No se firmó::$file tiene un bloque de código sin cerrar antes de «Aprobación humana», o no tiene «Cambio propuesto» fuera de uno. Cerralo y volvé a aprobar el PR."
              exit 1
            fi
            fingerprint="$(sha256sum < "$body_file" | cut -d' ' -f1)"
            # Las tres líneas, y el frontmatter se deja como está: `status: proposed` lo mueve quien
            # aplica, no quien firma. Autorizar y aplicar siguen siendo dos actos. Sólo dentro de «Aprobación humana»:
            # un fixture firmado puede traer la misma línea, y reescribirla rompería la huella recién calculada.
            sed -i \
              -e '/^## Aprobación humana/,$ s/^- Estado: pendiente$/- Estado: aprobada/' \
              -e "/^## Aprobación humana/,\$ s/^- Responsable: por definir\$/- Responsable: $signature/" \
              -e "/^## Aprobación humana/,\$ s/^- Fecha: por definir\$/- Fecha: $stamp\\n- Huella: sha256:$fingerprint/" "$file"
            signed="$signed $file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git add $signed
          git commit -m "docs: sign as @$APPROVER" -m "Firmado al aprobar el PR. La identidad sale de la aprobación de GitHub, que la autentica y no admite aprobarse a uno mismo."
          git push origin "HEAD:$BRANCH"
          # Un commit del `GITHUB_TOKEN` no dispara workflows, así que esta firma no vuelve a pasar por
          # CI. Es aceptable para tres líneas de un bloque de aprobación y no lo sería para un cambio de
          # código; la anotación lo deja dicho en vez de que se descubra.
          echo "::notice title=Propuesta firmada::@$APPROVER firmó:$signed. El commit lo hace el GITHUB_TOKEN, así que no dispara CI."
