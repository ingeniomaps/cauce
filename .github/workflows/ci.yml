name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Valida planning, automatización e integraciones y después corre las pruebas
      # exigiendo los umbrales de cobertura. Sin dependencias que instalar.
      - name: Validate and test
        run: npm run ci
