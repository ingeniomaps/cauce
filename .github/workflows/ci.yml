name: CI

on:
  # `pull_request` ya cubre cada commit de una rama; con los dos, el mismo corría dos veces.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancelar en `main` dejaba una release sin señal cuando el commit siguiente llegaba antes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Los dos extremos de lo que promete `engines`.
        node: ["24", current]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # No hay paso de instalación: el toolkit no tiene dependencias.
      - name: Validate and test
        run: npm run ci
