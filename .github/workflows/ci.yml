name: CI

on:
  # `pull_request` ya cubre cada commit de una rama; con los dos, el mismo corría dos veces.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancelar en `main` dejaba una release sin señal cuando el commit siguiente llegaba antes.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Los dos extremos de lo que promete `engines`.
        node: ["24", current]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # No hay paso de instalación: el toolkit no tiene dependencias.
      - name: Validate and test
        run: npm run ci
