name: Agent learning proposals

# Consolida el ciclo mensual de aprendizaje de todos los agentes. La lista sale del árbol
# `agents/<tipo>/<slug>/SKILL.md`, así que agregar un agente no toca este archivo.

on:
  schedule:
    # Cada cargo investiga al ritmo de su fuente más rápida, y la cadencia sale de `sources.yaml` —no
    # de una lista acá—: `agents list --json` la trae en `cadence`. Un aviso de seguridad publica todos
    # los días y llegar un mes tarde es llegar tarde; una norma se revisa por edición y mirarla cada
    # lunes devuelve el mismo texto.
    - cron: '17 13 * * 1'          # semanal
    - cron: '17 13 24 * *'         # mensual
    - cron: '17 13 23 3,6,9,12 *'  # trimestral
    # El ensamblaje siempre el 1, y temprano. La investigación mensual corre el 24 y no unas horas
    # antes: con siete días de margen, un cargo que falla se puede repetir antes del cierre. Y el día 1
    # cae lunes cuatro veces cada dos años —antes los dos crones disparaban al mismo minuto y el orden
    # quedaba librado a la cola—: a las 07 consolida el mes que cerró, y el informe de ese lunes ya
    # cuenta para el mes nuevo.
    - cron: '17 7 1 * *'           # ensamblaje
  workflow_dispatch:
    inputs:
      agent:
        description: 'Slug de un agente. Vacío corre todos.'
        required: false
        default: ''
      # Lanzarlo a mano disparaba también el ensamblaje mensual, así que probar `research` abría una
      # propuesta de regalo — y una propuesta cuesta una firma humana. Peor: consolidar **sella** los
      # informes que consume, o sea que un dispatch de prueba movía estado real del ciclo.
      #
      # `research` por defecto porque es para lo que se lanza a mano. El ensamblaje sigue corriendo
      # entero por su cron, y se puede pedir cuando de verdad haga falta.
      phase:
        description: 'Qué correr: research (default), propose o both.'
        required: false
        default: 'research'
        type: choice
        options: [research, propose, both]

# El default, para que un job nuevo nazca sin poder escribir hasta que alguien lo decida.
permissions:
  contents: read

# Este workflow ya no viaja a las instancias —`upgrade` lo retira—, así que sólo hay un CLI posible.
env:
  OPS: engine/cli/ops.js

# Dos corridas a la vez empujan la misma rama y la segunda falla al publicar. No se cancela la que
# está en curso: cortarla a mitad deja una parte de los cargos con PR y el resto sin nada.
concurrency:
  group: agent-learning
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agents: ${{ steps.list.outputs.agents }}
      flows: ${{ steps.flows.outputs.flows }}
      model: ${{ steps.creds.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

          # v7 enciende el caché de npm solo si `packageManager` está en package.json, y ese
          # caché exige un lock file. Acá no hay dependencias —ni una— así que no hay lock que
          # cachear y el paso fallaba entero. Se apaga: el input no existía en v4.
          package-manager-cache: false
      # El CLI resuelve la precedencia del catálogo; repetir ese recorrido acá lo dejaría
      # divergir en silencio la próxima vez que cambie la estructura.
      - name: List agents
        id: list
        env:
          ONLY: ${{ inputs.agent }}
          # Cuál de los cuatro crones disparó. Documentado: «Access the schedule event that triggered
          # the workflow through the github.event.schedule context» —docs.github.com, eventos que
          # disparan workflows, consultado 2026-08-23—. Vacío cuando se lanza a mano.
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          all=$(node "$OPS" agents list --json)
          node -e '
            const fs = require("fs")
            const only = (process.env.ONLY || "").trim()
            // Qué cadencia le toca a cada cron. El del ensamblaje no investiga: ese día sólo se
            // consolida, y por eso no aparece acá.
            const POR_CRON = {
              "17 13 * * 1": "semanal",
              "17 13 24 * *": "mensual",
              "17 13 23 3,6,9,12 *": "trimestral",
            }
            const cadence = POR_CRON[(process.env.SCHEDULE || "").trim()] || ""
            const roles = JSON.parse(process.argv[1])
            // Tres caminos, y lo que los separa no es la cadencia sino de dónde vino la corrida.
            // A mano con un slug: ése. A mano sin slug: todos, que es lo que quiere quien lo lanza.
            // Por cron: los de esa cadencia, y ninguno si el cron es el del ensamblaje —que no está
            // en la tabla justo para eso—.
            const porCron = Boolean((process.env.SCHEDULE || "").trim())
            const elegidos = only ? roles.filter((role) => role.slug === only)
              : porCron ? roles.filter((role) => role.cadence === cadence)
              : roles
            const list = elegidos.map((role) => role.slug).sort()
            // Vacío sólo es un error cuando alguien pidió algo concreto. El día del ensamblaje no
            // hay cadencia que investigar y la lista vacía es el resultado correcto: `research` no
            // arranca y `propose` sí.
            if (!list.length && (only || !cadence)) {
              console.error(only ? `No existe el agente "${only}".` : "No se encontró ningún agente.")
              process.exit(1)
            }
            console.log(`${list.length} cargo(s)${cadence ? ` de cadencia ${cadence}` : ""}`)
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `agents=${JSON.stringify(list)}\n`)
          ' "$all"

      # Los recorridos no salen de `agents list --json` —no son cargos— y por eso ninguno aprendió
      # nunca: el ciclo existía, funcionaba a mano y nada lo disparaba. Van en su propio paso porque
      # su disparador es otro: un cargo investiga por calendario, porque su profesión cambia sola
      # afuera; un recorrido sólo aprende cuando le fue mal, así que lo que decide es `pending`.
      # Sin ese filtro el día 1 abriría una propuesta por recorrido diciendo «no hay qué corregir»,
      # y cada una cuesta una firma humana.
      - name: List flows
        id: flows
        env:
          ONLY: ${{ inputs.agent }}
        run: |
          all=$(node "$OPS" flow list --json)
          node -e '
            const fs = require("fs")
            const only = (process.env.ONLY || "").trim()
            // Un slug a mano puede nombrar un cargo o un recorrido, y no hay forma de saber cuál sin
            // mirar las dos listas. Si no está acá, esta lista queda vacía y la de cargos decide.
            const flows = JSON.parse(process.argv[1])
              .filter((one) => (only ? one.slug === only : one.pending > 0))
            const list = flows.map((one) => one.slug).sort()
            console.log(`${list.length} recorrido(s) con corridas sin consolidar`)
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `flows=${JSON.stringify(list)}\n`)
          ' "$all"

      # Una vez, y acá: comprobarlo dentro de la matriz encendía cuarenta y siete jobs para saltearse.
      - name: Check credential
        id: creds
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH" ] || [ -n "$KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Sin CLAUDE_CODE_OAUTH_TOKEN ni ANTHROPIC_API_KEY: no hay investigación esta semana.'
          fi

  # Sin credencial no corre: `learn` sólo arma el andamiaje, y llenarlo es lo que hace el modelo.
  research:
    # El día del ensamblaje no se investiga: `discover` devuelve lista vacía y este job no arranca.
    if: >-
      needs.discover.outputs.agents != '[]' && needs.discover.outputs.model == 'true'
      && (github.event_name != 'workflow_dispatch' || inputs.phase != 'propose')
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.agents) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          # v7 enciende el caché de npm solo si `packageManager` está en package.json, y ese
          # caché exige un lock file. Acá no hay dependencias —ni una— así que no hay lock que
          # cachear y el paso fallaba entero. Se apaga: el input no existía en v4.
          package-manager-cache: false
      - name: Prepare report
        env:
          AGENT: ${{ matrix.agent }}
        run: node "$OPS" learn "$AGENT"
      # El prompt no lo escribe este archivo: lo declara el propio cargo en su
      # `learning/AUTOMATION.md`. Así un cargo nuevo trae su investigación sin tocar el cron.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.233

      # La suscripción primero y la API key como respaldo, cada una exportada sola.
      #
      # Tenerlas juntas en el entorno no elige: el CLI antepone `ANTHROPIC_API_KEY` al token de
      # suscripción, y en `-p` la usa siempre que esté presente. Con las dos puestas se pagaría API
      # sin que nada lo dijera, que es justo lo contrario de lo que este paso quiere.
      #
      # El respaldo se intenta ante cualquier fallo del primero, no sólo ante uno de credencial:
      # distinguirlos exigiría interpretar el error, y un reintento de más cuesta menos que una
      # semana sin investigación. Cuál se usó queda dicho en el log.
      - name: Research
        id: research
        env:
          AGENT: ${{ matrix.agent }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          APIKEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          prompt="Leé el learning/AUTOMATION.md del cargo $AGENT y ejecutá exactamente lo que declara. El informe de esta semana ya está creado y vacío: completalo. Cada afirmación necesita enlace, fecha y versión; lo que no puedas corroborar va a Preguntas abiertas en vez de afirmarse. El único archivo que escribís es ese informe."
          # Sin permisos declarados, `claude -p` no puede correr un comando ni salir a la web, que es
          # todo lo que una investigación hace. La primera corrida real duró tres minutos y devolvió el
          # informe vacío: «every tool this task needs is currently denied in this session». El cargo se
          # portó bien —«Per this role's own rule (R14), I won't fabricate sources, dates, or command
          # output»— y el workflow igual publicó el vacío.
          #
          # La lista sale del `AUTOMATION.md` de los cargos y no de lo cómodo: leer, buscar, escribir su
          # informe, y dos comandos nombrados. Saltear permisos le daría justo lo que su instrucción le
          # prohíbe —tocar dependencias, pruebas, código, SKILL.md, planificación, commit, push— y el
          # guard más barato contra eso es no dárselo.
          # Lo que la corrida costó y qué se le negó, en el resumen del job. Sin esto el gasto de una
          # investigación no era medible desde ningún lado, y un permiso mal escrito sólo se veía si
          # alguien leía dos líneas perdidas del log.
          informe() {
            node -e '
              const fs = require("fs")
              let d = null
              try { d = JSON.parse(fs.readFileSync(process.argv[1], "utf8")) } catch { d = null }
              if (!d) process.exit(0)
              const u = d.usage || {}
              const linea = (uno) => { console.log(uno); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, uno + "\n") }
              linea(`| costo | USD ${(d.total_cost_usd || 0).toFixed(4)} |`)
              linea(`| tokens | ${u.input_tokens || 0} entrada · ${u.output_tokens || 0} salida |`)
              linea(`| duración | ${Math.round((d.duration_ms || 0) / 1000)} s en ${d.num_turns || 0} turno(s) |`)
              const negados = d.permission_denials || []
              if (negados.length) linea(`| permisos negados | ${negados.map((one) => one.tool_name).join(", ")} |`)
            ' "$1" || true
          }
          # Un arreglo y no una cadena: sin comillas el shell parte `Bash(make agent-learn *)` en tres
          # palabras, y el CLI descarta la última con «Ignoring --allowedTools rule "*)"». Pasó en la
          # primera corrida con permisos: Bash nunca se concedió, y la investigación salió igual porque
          # con web y lectura alcanzaba —el modelo lo dijo, «no curl access this run»— así que el
          # defecto no se veía en el resultado sino en dos líneas del log.
          TOOLS=(--allowedTools WebSearch WebFetch Read Glob Grep Edit
            'Bash(make agent-learn *)' 'Bash(make agent-evaluate *)')
          # `json` cierra con `total_cost_usd`, `usage` y `permission_denials`: es lo único que vuelve
          # medible lo que cuesta una corrida, y lo que delata un permiso mal escrito como el de arriba.
          # Pero bufferea hasta el final, así que el log queda mudo los diez minutos que dura: por eso
          # va el latido de abajo. Sin él no se distingue una investigación de una corrida colgada, y la
          # única salida es esperar los treinta minutos del timeout para saber cuál era.
          FORMAT=(--output-format json)

          # Corre en segundo plano y late cada minuto. El latido es del shell y no del modelo: si el
          # proceso muriera, `kill -0` falla y el bucle corta — no puede mentir que sigue vivo.
          # `RUNNER_TEMP` sólo existe dentro de Actions, y la prueba ejecuta este mismo paso con un
          # `claude` falso: sin default la redirección apuntaba a `/claude.json` y el proceso moría.
          TMP="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          investigar() {
            "$@" > "$TMP/claude.json" 2>"$TMP/claude.err" &
            # Se poléa cada pocos segundos y se habla cada minuto: con `sleep 60` una corrida que
            # termina en dos segundos igual esperaba el minuto entero, y la prueba que ejecuta este
            # mismo paso con un `claude` falso se colgaba dos minutos.
            local pid=$! espera=0
            while kill -0 "$pid" 2>/dev/null; do
              sleep 5
              espera=$((espera + 5))
              if [ "$((espera % 60))" -eq 0 ] && kill -0 "$pid" 2>/dev/null; then
                echo "· investigando, van $((espera / 60)) min (timeout a los 30)"
              fi
            done
            wait "$pid"
            local salida=$?
            cat "$TMP/claude.err" >&2 || true
            informe "$TMP/claude.json"
            return $salida
          }
          if [ -n "$OAUTH" ]; then
            echo "Credencial: suscripción (CLAUDE_CODE_OAUTH_TOKEN)."
            if investigar env -u ANTHROPIC_API_KEY CLAUDE_CODE_OAUTH_TOKEN="$OAUTH" \
                 claude -p "$prompt" "${TOOLS[@]}" "${FORMAT[@]}"; then
              exit 0
            fi
            echo "La corrida con la suscripción falló." >&2
            if [ -z "$APIKEY" ]; then exit 1; fi
            echo "Reintento con ANTHROPIC_API_KEY, que se factura por token." >&2
          elif [ -z "$APIKEY" ]; then
            echo "Sin credencial: no hay con qué investigar." >&2
            exit 1
          else
            echo "Credencial: API key (ANTHROPIC_API_KEY). Se factura por token."
          fi
          investigar env -u CLAUDE_CODE_OAUTH_TOKEN ANTHROPIC_API_KEY="$APIKEY" \
            claude -p "$prompt" "${TOOLS[@]}" "${FORMAT[@]}"
      - name: Detect changes
        id: changes
        # `git status --porcelain` y no `git diff`: lo que el ciclo produce son archivos nuevos, y
        # `git diff` sólo mira lo trackeado. Con él, el paso que sigue no corría nunca.
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # El informe sale de acá como artifact, no como commit. Lo que el agente escribió fuera de su
      # informe se queda en este runner y muere con él: no hay credencial con que sacarlo.
      - name: Collect report
        if: steps.changes.outputs.changed == 'true'
        id: collect
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          stamp="$(date -u +%Y-%m-%d)"
          report="$(git ls-files --others --modified --exclude-standard -- "agents/*/$AGENT/learning/reports/$stamp.md")"
          if [ -z "$report" ]; then
            echo "El agente no escribió su informe; lo que haya tocado no sale de acá." >&2
            git status --porcelain >&2
            exit 1
          fi
          # Y que exista no alcanza: `learn` lo crea vacío y el modelo puede devolverlo tal cual. Así
          # salió la primera corrida real, y `research-pr` lo publicó igual — un lunes eso son 29 PRs en
          # blanco y nada lo dice. Es la forma que R15 nombra: se lee entero y no lo está.
          #
          # Se mira contenido y no tamaño: las secciones que la propuesta mensual consolida son las que
          # tienen que tener algo. Un informe vacío puede ser una negativa correcta —negarse a fabricar
          # bajo R14 lo es— pero eso se lee en el log, no en un PR: la propuesta que lo consolide
          # recibiría un insumo que no existe. Falla ruidoso y lo mira una persona.
          vacias=""
          for seccion in 'Fuentes consultadas' 'Hallazgos'; do
            cuerpo="$(awk -v s="## $seccion" '
              index($0, s) == 1 { on = 1; next } on && /^## / { exit } on && NF { print }
            ' "$report" | grep -v '^<!--' | grep -cv '^\s*$' || true)"
            if [ "$cuerpo" -eq 0 ]; then vacias="$vacias $seccion"; fi
          done
          if [ -n "$vacias" ]; then
            echo "El informe de $AGENT quedó sin contenido en:$vacias" >&2
            echo "No se abre PR: una propuesta construida sobre esto consolidaría un insumo que no existe." >&2
            echo "Mirá el paso «Research» — la causa suele ser una herramienta denegada, no el modelo." >&2
            exit 1
          fi
          echo "path=$report" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
      - name: Upload report
        if: steps.collect.outputs.path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: research-${{ matrix.agent }}
          path: ${{ steps.collect.outputs.path }}
          retention-days: 7

  # Segundo job y no un paso más: acá vive la credencial de escritura, y para llegar hasta acá el
  # informe tuvo que pasar por un artifact. Este job no habla con ningún modelo ni lee la web —
  # recibe un archivo, comprueba que caiga donde debe, y lo commitea.
  research-pr:
    needs: [discover, research]
    # No exige que la matriz entera haya salido bien: con `result == 'success'`, un cargo que falla
    # se llevaba los PR de los otros y sus informes expiraban en el artifact. Cada pata tolera no
    # encontrar el suyo, así que alcanza con que la investigación no se haya salteado.
    if: ${{ !cancelled() && needs.research.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.agents) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download report
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: research-${{ matrix.agent }}
          path: ${{ github.workspace }}
      - name: Open research pull request
        if: steps.fetch.outcome == 'success'
        env:
          AGENT: ${{ matrix.agent }}
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp="$(date -u +%Y-%m-%d)"
          branch="automation/$AGENT-research-$stamp"
          # El artifact trae contenido, no destino: `upload-artifact` aplana la ruta de un archivo
          # suelto, así que llega como `<fecha>.md` a la raíz. Dónde va se resuelve **acá**, con el
          # mismo CLI que resolvió el catálogo antes, y eso además es la garantía: nada de lo que
          # venga en el artifact puede redirigir dónde aterriza el archivo.
          dir="$(node "$OPS" agents list --json | node -e '
            let s = ""
            process.stdin.on("data", (d) => { s += d }).on("end", () => {
              const found = JSON.parse(s).find((role) => role.slug === process.env.AGENT)
              if (!found) { console.error("agente desconocido"); process.exit(1) }
              console.log(found.path)
            })')"
          dest="$dir/learning/reports/$stamp.md"
          if [ ! -f "$stamp.md" ]; then
            echo "No llegó el informe de $AGENT: el artifact no trae $stamp.md." >&2
            exit 1
          fi
          mkdir -p "$(dirname "$dest")"
          mv "$stamp.md" "$dest"
          # `-uall` y no el default: sin él git colapsa un directorio sin trackear en una sola línea
          # —`?? .../learning/reports/`— y el chequeo, que compara contra la ruta del archivo, no la
          # encontraba. Como `reports/` nace con el primer informe, eso abortaba la publicación del
          # primero de cada cargo: 43 de los 47 no tienen ese directorio en git todavía.
          otros="$(git status --porcelain -uall | awk '{print $2}' | grep -v -F "$dest" || true)"
          if [ -n "$otros" ]; then
            echo "Se esperaba exactamente el informe de $AGENT y nada más." >&2
            git status --porcelain -uall >&2
            exit 1
          fi
          report="$dest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$report"
          git commit -m "docs($AGENT): weekly research $stamp"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "$AGENT weekly research — $stamp" \
            --body "Investigación semanal de la profesión. No modifica SKILL.md ni propone cambios: alimenta la propuesta mensual."

  # Este job no habla con ningún modelo: consolida informes ya commiteados con el CLI y abre el PR.
  # Por eso puede escribir sin la separación que exige `research`.
  propose:
    if: >-
      github.event.schedule == '17 7 1 * *'
      || (github.event_name == 'workflow_dispatch' && inputs.phase != 'research')
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.agents) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

          # v7 enciende el caché de npm solo si `packageManager` está en package.json, y ese
          # caché exige un lock file. Acá no hay dependencias —ni una— así que no hay lock que
          # cachear y el paso fallaba entero. Se apaga: el input no existía en v4.
          package-manager-cache: false
      - name: Validate current agent
        env:
          AGENT: ${{ matrix.agent }}
        run: node "$OPS" evaluate "$AGENT"

      # La propuesta se llama por el mes en que se abre y se lleva todo lo que todavía no entró, que
      # el día 1 son los informes del mes que cerró. Nombrarle el mes anterior parecía más exacto y
      # era peor: ese mes puede tener ya una propuesta aplicada, y entonces el cron abría una
      # **revisión** —el documento que corrige un cambio que la evaluación mostró mal calibrado—
      # vacía y sin que nadie lo hubiera decidido. Corregir es un acto humano, no un paso del cron.
      - name: Build monthly proposal from weekly reports
        env:
          AGENT: ${{ matrix.agent }}
        run: node "$OPS" learn "$AGENT" --proposal

      - name: Validate proposal
        env:
          AGENT: ${{ matrix.agent }}
        run: node "$OPS" evaluate "$AGENT"

      - name: Detect changes
        id: changes
        # `git status --porcelain` y no `git diff`: lo que el ciclo produce son archivos nuevos, y
        # `git diff` sólo mira lo trackeado. Con él, el paso que sigue no corría nunca.
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open proposal pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          AGENT: ${{ matrix.agent }}
          GH_TOKEN: ${{ github.token }}
        run: |
          period="$(date -u +%Y-%m)"
          # El período y no el archivo: una propuesta ya aplicada se corrige abriendo `<período>-rN.md`,
          # y buscando sólo `<período>.md` esa revisión no aparecía. El paso la leía como «cambió
          # archivos fuera de su propuesta» y la dejaba sin PR, que es justo cuando el ciclo la necesita.
          proposal="$(git ls-files --others --modified --exclude-standard -- "agents/*/$AGENT/learning/proposals/$period*.md")"
          if [ -z "$proposal" ]; then
            echo "El agente cambió archivos fuera de su propuesta; no se abre PR." >&2
            git status --porcelain >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "$proposal" | wc -l)" -gt 1 ]; then
            echo "Se esperaba una sola propuesta de $AGENT para $period:" >&2
            printf '%s\n' "$proposal" >&2
            exit 1
          fi
          # La rama lleva el nombre del documento y no el del período: la revisión no reemplaza a la
          # propuesta que corrige, así que tampoco puede pisarle la rama ni el PR.
          name="$(basename "$proposal" .md)"
          branch="automation/$AGENT-$name"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$proposal"
          git commit -m "docs($AGENT): propose $name learning review"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "$AGENT learning proposal — $name" \
            --body "Propuesta automática construida desde los informes semanales. No modifica SKILL.md y requiere evaluación y aprobación humana."

  # El espejo de `propose` para los recorridos, y como aquél no habla con ningún modelo: consolida
  # veredictos ya commiteados con el CLI y abre el PR. Corre el mismo día —el del ensamblaje— porque
  # es cuando se consolida, no cuando se investiga: un recorrido no investiga nunca.
  propose-flows:
    if: >-
      needs.discover.outputs.flows != '[]'
      && (github.event.schedule == '17 7 1 * *'
        || (github.event_name == 'workflow_dispatch' && inputs.phase != 'research'))
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        flow: ${{ fromJSON(needs.discover.outputs.flows) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

          # v7 enciende el caché de npm solo si `packageManager` está en package.json, y ese
          # caché exige un lock file. Acá no hay dependencias —ni una— así que no hay lock que
          # cachear y el paso fallaba entero. Se apaga: el input no existía en v4.
          package-manager-cache: false
      - name: Validate current flow
        env:
          FLOW: ${{ matrix.flow }}
        run: node "$OPS" flow check "$FLOW"

      # Consolidar marca las corridas que entraron, así que el diff trae la propuesta **y** los
      # registros sellados. Los dos van al PR: sin el sello, la próxima corrida los volvería a leer.
      - name: Build proposal from unconsolidated runs
        env:
          FLOW: ${{ matrix.flow }}
        run: node "$OPS" learn "$FLOW" --flow --proposal

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open proposal pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          FLOW: ${{ matrix.flow }}
          GH_TOKEN: ${{ github.token }}
        run: |
          period="$(date -u +%Y-%m)"
          changed="$(git ls-files --others --modified --exclude-standard -- "flows/*/$FLOW/")"
          proposal="$(printf '%s\n' "$changed" | grep -F "/learning/proposals/$period" || true)"
          if [ -z "$proposal" ]; then
            echo "El recorrido cambió archivos fuera de su propuesta; no se abre PR." >&2
            git status --porcelain >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "$proposal" | wc -l)" -gt 1 ]; then
            echo "Se esperaba una sola propuesta de $FLOW para $period:" >&2
            printf '%s\n' "$proposal" >&2
            exit 1
          fi
          name="$(basename "$proposal" .md)"
          branch="automation/$FLOW-$name"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          printf '%s\n' "$changed" | xargs git add --
          git commit -m "docs($FLOW): propose $name flow review"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "$FLOW flow proposal — $name" \
            --body "Propuesta automática construida desde los veredictos en contra de sus propias corridas. No modifica el contrato de ningún cargo y requiere evaluación y aprobación humana."
