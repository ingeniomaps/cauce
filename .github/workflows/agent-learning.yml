name: Agent learning proposals

# Consolida el ciclo mensual de aprendizaje de todos los agentes. La lista sale del árbol
# `agents/<tipo>/<slug>/SKILL.md`, así que agregar un agente no toca este archivo.

on:
  schedule:
    # Semanal la investigación, mensual la consolidación. La propuesta sólo vale si antes hubo
    # informes: consolidar sin ellos produce un andamiaje vacío que nadie puede aprobar.
    - cron: '17 13 * * 1'
    - cron: '17 13 1 * *'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Slug de un agente. Vacío corre todos.'
        required: false
        default: ''

# El default, para que un job nuevo nazca sin poder escribir hasta que alguien lo decida.
permissions:
  contents: read

# Este workflow ya no viaja a las instancias —`upgrade` lo retira—, así que sólo hay un CLI posible.
env:
  OPS: engine/cli/ops.js

# Dos corridas a la vez empujan la misma rama y la segunda falla al publicar. No se cancela la que
# está en curso: cortarla a mitad deja una parte de los cargos con PR y el resto sin nada.
concurrency:
  group: agent-learning
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agents: ${{ steps.list.outputs.agents }}
      model: ${{ steps.creds.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      # El CLI resuelve la precedencia del catálogo; repetir ese recorrido acá lo dejaría
      # divergir en silencio la próxima vez que cambie la estructura.
      - name: List agents
        id: list
        env:
          ONLY: ${{ inputs.agent }}
        run: |
          all=$(node "$OPS" agents list --json)
          node -e '
            const fs = require("fs")
            const only = (process.env.ONLY || "").trim()
            const slugs = JSON.parse(process.argv[1]).map((role) => role.slug)
            const list = only ? slugs.filter((slug) => slug === only) : slugs.sort()
            if (!list.length) {
              console.error(only ? `No existe el agente "${only}".` : "No se encontró ningún agente.")
              process.exit(1)
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `agents=${JSON.stringify(list)}\n`)
          ' "$all"

      # Una vez y con aviso visible: comprobarlo dentro de la matriz dejaba cuarenta y siete jobs
      # salteándose en verde, y la corrida entera parecía haber trabajado.
      - name: Check credential
        id: creds
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Sin ANTHROPIC_API_KEY no hay investigación: esta corrida no escribe nada.'
          fi

  # Sin credencial no corre: `learn` sólo arma el andamiaje, y llenarlo es lo que hace el modelo.
  research:
    if: github.event.schedule != '17 13 1 * *' && needs.discover.outputs.model == 'true'
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.agents) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Prepare report
        env:
          AGENT: ${{ matrix.agent }}
        run: node "$OPS" learn "$AGENT"
      # El prompt no lo escribe este archivo: lo declara el propio cargo en su
      # `learning/AUTOMATION.md`. Así un cargo nuevo trae su investigación sin tocar el cron.
      - name: Research
        env:
          AGENT: ${{ matrix.agent }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.233
          claude -p "Leé el learning/AUTOMATION.md del cargo $AGENT y ejecutá exactamente lo que declara. El informe de esta semana ya está creado y vacío: completalo. Cada afirmación necesita enlace, fecha y versión; lo que no puedas corroborar va a Preguntas abiertas en vez de afirmarse. El único archivo que escribís es ese informe."
      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # El informe sale de acá como artifact, no como commit. Lo que el agente escribió fuera de su
      # informe se queda en este runner y muere con él: no hay credencial con que sacarlo.
      - name: Collect report
        if: steps.changes.outputs.changed == 'true'
        id: collect
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          stamp="$(date -u +%Y-%m-%d)"
          report="$(git diff --name-only -- "agents/*/$AGENT/learning/reports/$stamp.md")"
          if [ -z "$report" ]; then
            echo "El agente no escribió su informe; lo que haya tocado no sale de acá." >&2
            git diff --name-only >&2
            exit 1
          fi
          echo "path=$report" >> "$GITHUB_OUTPUT"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
      - name: Upload report
        if: steps.collect.outputs.path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: research-${{ matrix.agent }}
          path: ${{ steps.collect.outputs.path }}
          retention-days: 7

  # Segundo job y no un paso más: acá vive la credencial de escritura, y para llegar hasta acá el
  # informe tuvo que pasar por un artifact. Este job no habla con ningún modelo ni lee la web —
  # recibe un archivo, comprueba que caiga donde debe, y lo commitea.
  research-pr:
    needs: [discover, research]
    # No exige que la matriz entera haya salido bien: con `result == 'success'`, un cargo que falla
    # se llevaba los PR de los otros y sus informes expiraban en el artifact. Cada pata tolera no
    # encontrar el suyo, así que alcanza con que la investigación no se haya salteado.
    if: ${{ !cancelled() && needs.research.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.agents) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download report
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: research-${{ matrix.agent }}
          path: ${{ github.workspace }}
      - name: Open research pull request
        if: steps.fetch.outcome == 'success'
        env:
          AGENT: ${{ matrix.agent }}
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp="$(date -u +%Y-%m-%d)"
          branch="automation/$AGENT-research-$stamp"
          # El artifact trae contenido, no destino: `upload-artifact` aplana la ruta de un archivo
          # suelto, así que llega como `<fecha>.md` a la raíz. Dónde va se resuelve **acá**, con el
          # mismo CLI que resolvió el catálogo antes, y eso además es la garantía: nada de lo que
          # venga en el artifact puede redirigir dónde aterriza el archivo.
          dir="$(node "$OPS" agents list --json | node -e '
            let s = ""
            process.stdin.on("data", (d) => { s += d }).on("end", () => {
              const found = JSON.parse(s).find((role) => role.slug === process.env.AGENT)
              if (!found) { console.error("agente desconocido"); process.exit(1) }
              console.log(found.path)
            })')"
          dest="$dir/learning/reports/$stamp.md"
          if [ ! -f "$stamp.md" ]; then
            echo "No llegó el informe de $AGENT: el artifact no trae $stamp.md." >&2
            exit 1
          fi
          mkdir -p "$(dirname "$dest")"
          mv "$stamp.md" "$dest"
          otros="$(git status --porcelain | awk '{print $2}' | grep -v -F "$dest" || true)"
          if [ -n "$otros" ]; then
            echo "Se esperaba exactamente el informe de $AGENT y nada más." >&2
            git status --porcelain >&2
            exit 1
          fi
          report="$dest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$report"
          git commit -m "docs($AGENT): weekly research $stamp"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "$AGENT weekly research — $stamp" \
            --body "Investigación semanal de la profesión. No modifica SKILL.md ni propone cambios: alimenta la propuesta mensual."

  # Este job no habla con ningún modelo: consolida informes ya commiteados con el CLI y abre el PR.
  # Por eso puede escribir sin la separación que exige `research`.
  propose:
    if: github.event.schedule == '17 13 1 * *' || github.event_name == 'workflow_dispatch'
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.agents) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Validate current agent
        env:
          AGENT: ${{ matrix.agent }}
        run: node "$OPS" evaluate "$AGENT"

      - name: Build monthly proposal from weekly reports
        env:
          AGENT: ${{ matrix.agent }}
        run: node "$OPS" learn "$AGENT" --proposal

      - name: Validate proposal
        env:
          AGENT: ${{ matrix.agent }}
        run: node "$OPS" evaluate "$AGENT"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open proposal pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          AGENT: ${{ matrix.agent }}
          GH_TOKEN: ${{ github.token }}
        run: |
          period="$(date -u +%Y-%m)"
          branch="automation/$AGENT-$period"
          proposal="$(git diff --name-only -- "agents/*/$AGENT/learning/proposals/$period.md")"
          if [ -z "$proposal" ]; then
            echo "El agente cambió archivos fuera de su propuesta; no se abre PR." >&2
            git diff --name-only >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$proposal"
          git commit -m "docs($AGENT): propose $period learning review"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "$AGENT learning proposal — $period" \
            --body "Propuesta automática construida desde los informes semanales. No modifica SKILL.md y requiere evaluación y aprobación humana."
