name: Agent learning proposals

# Consolida el ciclo mensual de aprendizaje de todos los agentes. La lista sale del árbol
# `agents/<tipo>/<slug>/SKILL.md`, así que agregar un agente no toca este archivo.

on:
  schedule:
    # Semanal la investigación, mensual la consolidación. La propuesta sólo vale si antes hubo
    # informes: consolidar sin ellos produce un andamiaje vacío que nadie puede aprobar.
    - cron: "17 13 * * 1"
    - cron: "17 13 1 * *"
  workflow_dispatch:
    inputs:
      agent:
        description: "Slug de un agente. Vacío corre todos."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.list.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve CLI
        id: cli
        run: |
          for candidate in tools/ops.js .ops/engine/cli/ops.js engine/cli/ops.js; do
            if [ -f "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No se encontró el CLI de Cauce." >&2
          exit 1

      # El CLI resuelve la precedencia del catálogo; repetir ese recorrido acá lo dejaría
      # divergir en silencio la próxima vez que cambie la estructura.
      - name: List agents
        id: list
        env:
          ONLY: ${{ inputs.agent }}
          OPS: ${{ steps.cli.outputs.path }}
        run: |
          all=$(node "$OPS" agents list . --json)
          node -e '
            const fs = require("fs")
            const only = (process.env.ONLY || "").trim()
            const slugs = JSON.parse(process.argv[1]).map((role) => role.slug)
            const list = only ? slugs.filter((slug) => slug === only) : slugs.sort()
            if (!list.length) {
              console.error(only ? `No existe el agente "${only}".` : "No se encontró ningún agente.")
              process.exit(1)
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `agents=${JSON.stringify(list)}\n`)
          ' "$all"

  # La investigación necesita un modelo, así que este job sólo corre si el repositorio declara una
  # credencial. Sin ella se saltea entero en vez de abrir un PR por cargo con un informe vacío, que
  # es ruido con forma de trabajo. `learn` solo arma el andamiaje; llenarlo es lo que hace un agente.
  research:
    if: github.event.schedule != '17 13 1 * *'
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check credential
        id: creds
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Sin ANTHROPIC_API_KEY: la investigación semanal queda para correr a mano." >&2
          fi
      - name: Resolve CLI
        if: steps.creds.outputs.ready == 'true'
        id: cli
        run: |
          for candidate in tools/ops.js engine/cli/ops.js; do
            if [ -f "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No se encontró el CLI de Cauce." >&2
          exit 1
      - name: Prepare report
        if: steps.creds.outputs.ready == 'true'
        env:
          AGENT: ${{ matrix.agent }}
          OPS: ${{ steps.cli.outputs.path }}
        run: node "$OPS" learn "$AGENT"
      # El prompt no lo escribe este archivo: lo declara el propio cargo en su
      # `learning/AUTOMATION.md`. Así un cargo nuevo trae su investigación sin tocar el cron.
      - name: Research
        if: steps.creds.outputs.ready == 'true'
        env:
          AGENT: ${{ matrix.agent }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "Leé el learning/AUTOMATION.md del cargo $AGENT y ejecutá exactamente lo que declara. El informe de esta semana ya está creado y vacío: completalo. Cada afirmación necesita enlace, fecha y versión; lo que no puedas corroborar va a Preguntas abiertas en vez de afirmarse. El único archivo que escribís es ese informe."
      - name: Detect changes
        if: steps.creds.outputs.ready == 'true'
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open research pull request
        if: steps.creds.outputs.ready == 'true' && steps.changes.outputs.changed == 'true'
        env:
          AGENT: ${{ matrix.agent }}
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp="$(date -u +%Y-%m-%d)"
          branch="automation/$AGENT-research-$stamp"
          report="$(git diff --name-only -- "agents/*/$AGENT/learning/reports/$stamp.md")"
          if [ -z "$report" ]; then
            echo "El agente cambió archivos fuera de su informe; no se abre PR." >&2
            git diff --name-only >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$report"
          git commit -m "docs($AGENT): weekly research $stamp"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "$AGENT weekly research — $stamp" \
            --body "Investigación semanal de la profesión. No modifica SKILL.md ni propone cambios: alimenta la propuesta mensual."

  propose:
    if: github.event.schedule == '17 13 1 * *' || github.event_name == 'workflow_dispatch'
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        agent: ${{ fromJSON(needs.discover.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # El CLI vive en `tools/ops.js` dentro de un proyecto generado y en `engine/cli/ops.js`
      # dentro del repositorio del toolkit.
      - name: Resolve CLI
        id: cli
        run: |
          for candidate in tools/ops.js .ops/engine/cli/ops.js engine/cli/ops.js; do
            if [ -f "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No se encontró el CLI de Cauce." >&2
          exit 1

      - name: Validate current agent
        env:
          AGENT: ${{ matrix.agent }}
          OPS: ${{ steps.cli.outputs.path }}
        run: node "$OPS" evaluate "$AGENT"

      - name: Build monthly proposal from weekly reports
        env:
          AGENT: ${{ matrix.agent }}
          OPS: ${{ steps.cli.outputs.path }}
        run: node "$OPS" learn "$AGENT" --proposal

      - name: Validate proposal
        env:
          AGENT: ${{ matrix.agent }}
          OPS: ${{ steps.cli.outputs.path }}
        run: node "$OPS" evaluate "$AGENT"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open proposal pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          AGENT: ${{ matrix.agent }}
          GH_TOKEN: ${{ github.token }}
        run: |
          period="$(date -u +%Y-%m)"
          branch="automation/$AGENT-$period"
          proposal="$(git diff --name-only -- "agents/*/$AGENT/learning/proposals/$period.md")"
          if [ -z "$proposal" ]; then
            echo "El agente cambió archivos fuera de su propuesta; no se abre PR." >&2
            git diff --name-only >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$proposal"
          git commit -m "docs($AGENT): propose $period learning review"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "$AGENT learning proposal — $period" \
            --body "Propuesta automática construida desde los informes semanales. No modifica SKILL.md y requiere evaluación y aprobación humana."
