name: Delete merged branch

# Borra la rama de un PR cuando el merge **ocurre**, que es el momento al que nadie más llega: ni
# `gh pr merge --delete-branch` combinado con `--auto`, ni el `delete_branch_on_merge` del
# repositorio. Por qué ninguno de los dos alcanza está medido en el caso 147.
#
# De ahí sale el disparador y es lo único que hay que entender para tocar este archivo: `closed` es el
# único evento que llega con el merge ya hecho, venga de auto-merge, de la web o de alguien que mergeó
# sin la bandera.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  delete:
    # `closed` también llega cuando el PR se cierra sin mergear, y ahí la rama es trabajo vivo de
    # alguien: borrarla sería tirarlo. Sólo el merge autoriza el borrado.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete the head branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Una rama de un fork no es nuestra y el token no la alcanza: se dice y se sale en verde.
          if [ "$SAME_REPO" != 'true' ]; then
            echo "::notice title=Rama ajena::$BRANCH vive en un fork; no se borra desde acá."
            exit 0
          fi
          # Que exista se comprueba antes de pedir el borrado: quien mergea con `--delete-branch` ya la
          # borró, y sin esto el ciclo normal terminaría en rojo por hacer bien su trabajo.
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "::notice title=Ya no estaba::$BRANCH la borró quien mergeó; no hay nada que hacer."
            exit 0
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
          echo "::notice title=Rama borrada::$BRANCH, después de que su merge ocurriera."
