name: Release PR

# El número de versión no se calcula: se lee. Sale del encabezado más nuevo de CHANGELOG.md, que es
# donde ya se decide —«un cambio en el protocolo, en las reglas del sistema o en un guard sube minor
# aunque no toque una sola línea de código»—. Un bot que contara `feat:` contra `fix:` se equivocaría
# en las dos direcciones: mediría qué se tocó acá y no qué le cambia a quien recibe el `upgrade`.
#
# Lo que este workflow hace es abrir el PR que sincroniza `package.json` con esa decisión. Mergearlo es
# el acto humano, y ese merge es lo que dispara `release.yml`: publica y crea el tag. Por qué alcanza
# con el merge y no hace falta un tag empujado a mano lo explica el encabezado de `release.yml`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Dos pushes seguidos a `main` corren esto dos veces sobre la misma rama de release. No se cancela la
# que está en curso: cortarla entre el `git push` y el `gh pr create` deja la rama publicada y ningún
# PR que la explique.
concurrency:
  group: release-pr
  cancel-in-progress: false

env:
  OPS: engine/cli/ops.js

jobs:
  # No `propose`: así se llama también un job de `agent-learning`, y en la lista de Actions los dos
  # aparecían con el mismo nombre.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Lo que se necesita son los tags —para saber si la versión ya salió—, no la historia. Con
          # `fetch-depth: 0` se traía el repo entero en cada push a main y sólo crece.
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Read the decided version
        id: read
        run: |
          # El primer encabezado del archivo es la entrada más nueva.
          changelog="$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')"
          package="$(node -p 'require("./package.json").version')"
          if [ -z "$changelog" ]; then
            echo "CHANGELOG.md no tiene ninguna entrada con versión." >&2
            exit 1
          fi
          # Sólo hacia adelante. La condición de abajo era «distintas», y con `package.json` por delante
          # del CHANGELOG eso abría un PR que **bajaba** la versión: una versión ya publicada no se
          # republica, así que el PR habría propuesto pisar npm con un número que ya salió. Pasa cuando
          # alguien sube la versión sin escribir su entrada, y ahí lo que falta es la entrada.
          if [ "$changelog" != "$package" ] && \
             [ "$(printf '%s\n%s\n' "$changelog" "$package" | sort -V | tail -1)" != "$changelog" ]; then
            echo "package.json ($package) va por delante del CHANGELOG ($changelog). Falta su entrada." >&2
            exit 1
          fi
          echo "changelog=$changelog" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "Decidida $changelog · package.json $package"

      # Ya sincronizados: no hay PR que abrir. Lo que puede faltar es el tag, y eso se dice abajo.
      - name: Open the release pull request
        if: steps.read.outputs.changelog != steps.read.outputs.package
        env:
          VERSION: ${{ steps.read.outputs.changelog }}
          BEFORE: ${{ steps.read.outputs.package }}
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/$VERSION"
          # La rama se rehace en cada corrida: el CHANGELOG puede haber cambiado desde la anterior, y
          # una rama vieja abriría un PR que dice una versión y trae otra.
          #
          # Traer su estado remoto antes es lo que vuelve posible el `--force-with-lease` de abajo: sin
          # la referencia de seguimiento, git no tiene contra qué comparar y se niega con «stale info»
          # en vez de empujar. Pasa exactamente en la segunda corrida, que es cuando la rama ya existe
          # allá y no acá — y es la corrida que importa, porque la primera puede haber fallado después
          # de empujarla.
          git fetch origin "$branch" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch" || git switch "$branch"
          node -e '
            const fs = require("fs")
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"))
            pkg.version = process.env.VERSION
            fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`)
          '
          # Nada más que la versión: si el árbol trae otra cosa, alguien empujó a la rama de release.
          otros="$(git status --porcelain -uall | awk '{print $2}' | grep -v -F 'package.json' || true)"
          if [ -n "$otros" ]; then
            echo "Se esperaba sólo package.json y apareció: $otros" >&2
            exit 1
          fi
          if git diff --quiet -- package.json; then
            echo "package.json ya estaba en $VERSION en esta rama."
          else
            git add package.json
            git commit -m "chore(release): $VERSION"
          fi
          git push --force-with-lease origin "$branch"
          cuerpo="$(printf '%s\n' \
            "Sube \`package.json\` de $BEFORE a **$VERSION**, que es lo que declara la entrada más nueva de \`CHANGELOG.md\`." \
            "" \
            "Al mergearlo se publica: \`release.yml\` corre con ese merge, publica en npm y crea el tag." \
            "" \
            "El merge es el acto humano que \`R10\` pide, y \`release.yml\` verifica que la versión no haya salido y que el CHANGELOG tenga su entrada antes de tocar npm.")"
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "release: $VERSION" --body "$cuerpo"
          else
            gh pr create --base main --head "$branch" --title "release: $VERSION" --body "$cuerpo"
          fi

      # Lo que dejó a 0.42.0 y 0.43.0 publicadas sin tag: nada avisaba. Un aviso no bloquea nada y
      # convierte la deriva en algo que se ve en la corrida, en vez de descubrirse meses después
      # comparando npm contra git. Con el merge del PR de release sale siempre, porque `Release` corre
      # a la par y todavía no creó el tag; lo que dice importa si no hay ninguna `Release` en curso.
      - name: Warn when the released version has no tag
        if: steps.read.outputs.changelog == steps.read.outputs.package
        env:
          VERSION: ${{ steps.read.outputs.package }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION ya está tagueada."
          else
            echo "::notice title=Falta el tag::package.json está en $VERSION y no existe v$VERSION. Si \`Release\` no está corriendo ahora, falló: reintentala con gh workflow run release.yml"
          fi
