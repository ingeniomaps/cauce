name: Prune merged automation branches

# Borra las ramas `automation/*` que el auto-merge del bot dejó: cuando el merge lo hace `github-actions`,
# `delete_branch_on_merge` no actúa (caso 183), y desde el caso 246 todo informe de investigación se mergea
# así. Qué se borra y qué no lo decide `.github/scripts/prune-merged-branches.sh`.
#
# Corre dos veces al mes, después de cada momento en que el bot mergea, y no en cada cierre de PR: un
# workflow por PR gastaba CI para borrar una rama que casi siempre ya no estaba (caso 247).
#   - el 26, dos días después de la investigación del 24, para dar tiempo a autorizar su CI;
#   - el 3, dos días después del ensamblaje del 1, por las propuestas archivadas.
# Lo que todavía no se mergeó no se toca y lo levanta la pasada siguiente.
on:
  schedule:
    - cron: '17 9 26 * *'
    - cron: '17 9 3 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prune-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prune merged automation branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prune-merged-branches.sh
