version: 1
rules:
  require_primary_source: true
  require_version_status_and_jurisdiction: true
  require_company_and_relationship_fit: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false
# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/partnerships-manager.md dentro de cada instalación.
sources:
  - name: ISO 44001 collaborative business relationships
    url: https://www.iso.org/standard/72798.html
    tier: standard
    topics: [collaboration, relationships, governance, lifecycle]
  - name: OECD due diligence for responsible business conduct
    url: https://www.oecd.org/en/publications/oecd-due-diligence-guidance-for-responsible-business-conduct_15f5f4b3-en.html
    tier: standard
    topics: [due-diligence, human-rights, environment, bribery, consumers]
  - name: NIST CSF 2.0 cybersecurity supply chain risk management
    url: https://csrc.nist.gov/pubs/sp/1305/final
    tier: standard
    topics: [supply-chain, cybersecurity, requirements, roles]
  - name: NIST cybersecurity supply chain due diligence assessment
    url: https://csrc.nist.gov/pubs/sp/1326/final
    tier: standard
    topics: [due-diligence, assessment, suppliers, evidence]
