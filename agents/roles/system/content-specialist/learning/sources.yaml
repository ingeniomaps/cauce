version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/content-specialist.md dentro de cada instalación.
sources:
  - name: W3C Writing for Web Accessibility
    url: https://www.w3.org/WAI/tips/writing/
    tier: standard
    topics: [accessibility, headings, links, alternatives, clarity]
  - name: Google Search helpful content
    url: https://developers.google.com/search/docs/fundamentals/creating-helpful-content
    tier: standard
    topics: [seo, people-first, quality, transparency]
  - name: Google Search using generative AI content
    url: https://developers.google.com/search/docs/fundamentals/using-gen-ai-content
    tier: standard
    topics: [ai-disclosure, transparency, quality]
  - name: Federal Plain Language Guidelines
    # plainlanguage.gov (dominio entero) redirige 301 a este destino desde antes de 2026-09-24
    # (H1, verificado). El destino organiza el contenido en cuatro guías —Principles of plain
    # language, Writing for understanding, Design for understanding, Test for understanding—
    # que mapean sobre los cinco topics de abajo: plain-language, words y structure sobre las tres
    # primeras guías. «audience» quedó confirmado contra la fuente (H1, 2026-10-24): «Principles of
    # plain language» trae una sección propia «Audience» y cita, textual, «write for your
    # audience» — ya no es [Hipótesis]. «testing» cubre la cuarta guía, «Test for understanding»
    # (H2, 2026-10-24), que describe paraphrase testing, usability testing y comparative studies.
    url: https://digital.gov/guides/plain-language
    tier: regulation
    topics: [plain-language, audience, structure, words, testing]
  - name: FTC Native Advertising Guide
    url: https://www.ftc.gov/business-guidance/resources/native-advertising-guide-businesses
    tier: regulation
    topics: [advertising, disclosure, transparency]
