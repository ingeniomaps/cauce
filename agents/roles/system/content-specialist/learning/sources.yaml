version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/content-specialist.md dentro de cada instalación.
sources:
  - name: W3C Writing for Web Accessibility
    url: https://www.w3.org/WAI/tips/writing/
    tier: standard
    topics: [accessibility, headings, links, alternatives, clarity]
  - name: Google Search helpful content
    url: https://developers.google.com/search/docs/fundamentals/creating-helpful-content
    tier: standard
    topics: [seo, people-first, quality, transparency]
  - name: Federal Plain Language Guidelines
    url: https://www.plainlanguage.gov/guidelines/
    tier: regulation
    topics: [plain-language, audience, structure, words]
  - name: FTC Native Advertising Guide
    url: https://www.ftc.gov/business-guidance/resources/native-advertising-guide-businesses
    tier: regulation
    topics: [advertising, disclosure, transparency]
