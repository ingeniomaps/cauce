version: 1
rules:
  require_primary_source: true
  require_method_version_domain_and_design_fit: true
  require_reproducible_analysis_and_assumption_checks: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false
# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/data-scientist.md dentro de cada instalación.
sources:
  - name: ASA Ethical Guidelines for Statistical Practice
    url: https://www.amstat.org/your-career/ethical-guidelines-for-statistical-practice
    tier: profession
    topics: [ethics, integrity, data, methods, communication]
  - name: NIST SEMATECH e-Handbook of Statistical Methods
    url: https://www.itl.nist.gov/div898/handbook/
    tier: standard
    topics: [statistics, experiments, exploration, modeling, assumptions]
  - name: ISO 3534-1 statistical vocabulary and probability
    url: https://committee.iso.org/standard/40145.html
    tier: standard
    topics: [statistics, probability, vocabulary, symbols]
  - name: ISO IEC 25012:2008 data quality model
    url: https://webstore.iec.ch/en/publication/11246
    tier: standard
    topics: [data-quality, requirements, measures, evaluation]
  - name: ASA Statement on the Role of Statistics in Data Science and Artificial Intelligence
    url: https://www.amstat.org/docs/default-source/amstat-documents/the-role-of-statistics-in-data-science-and-artificial-intelligence.pdf
    tier: profession
    topics: [ai, ml, data-science, causality, uncertainty]
  - name: ASA Statement on Ethical AI — Principles for Statistical Practitioners
    url: https://www.amstat.org/docs/default-source/amstat-documents/asa-statement-on-ethical-ai-principles-for-statistical-practitioners.pdf
    tier: profession
    topics: [ethics, ai, accountability, transparency, fairness]
  - name: ISO/IEC 5259-1:2024 data quality for analytics and machine learning (overview)
    url: https://committee.iso.org/standard/81088.html
    tier: standard
    topics: [data-quality, ai, ml, analytics]
