version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/qa-engineer.md dentro de cada instalación.
sources:
  - name: ISTQB CTFL
    url: https://www.istqb.org/certifications/certified-tester-foundation-level-ctfl-v4-0/
    tier: profession
    topics: [testing-principles, techniques, risk, defects]
  - name: ISO IEC 25010
    url: https://www.iso.org/standard/78176.html
    tier: standard
    topics: [product-quality-model]
  - name: OWASP Web Security Testing Guide
    url: https://owasp.org/www-project-web-security-testing-guide/
    tier: standard
    topics: [authorized-security-testing, web]
  - name: W3C WCAG 2.2
    url: https://www.w3.org/TR/WCAG22/
    tier: standard
    topics: [accessibility, conformance]
  - name: OWASP Top 10
    url: https://owasp.org/Top10/2025/0x00_2025-Introduction/
    tier: standard
    topics: [web-risk-model, supply-chain, misconfiguration, exceptional-conditions]
  - name: W3C WCAG 2.2 Errata
    url: https://www.w3.org/WAI/WCAG22/errata/
    tier: standard
    topics: [accessibility, errata]
  # Edición 2.0 del 2025-09-24, que **reemplaza** a ISO/IEC 40500:2012 — la identidad ISO de
  # WCAG 2.0—. Por eso el nombre lleva el año: «ISO/IEC 40500» a secas es ambiguo entre dos
  # documentos que dicen cosas distintas, y un contrato que exige uno no se satisface con el otro.
  # iso.org devuelve 403 desde el 2026-08-16, así que lo legible es la ficha del IEC Webstore
  # —https://webstore.iec.ch/en/publication/109927—, corroborada contra el anuncio de W3C del
  # 2025-10-21. Es ficha de catálogo: el texto de la norma no se leyó (informe 2026-08-22, H1).
  - name: ISO IEC 40500:2025
    url: https://www.iso.org/standard/91029.html
    tier: standard
    topics: [accessibility, conformance, iso-identity]
  # Extensión de 25010 para sistemas de IA. La única edición publicada es la de 2023 y su comité
  # es SC 42 —no SC 7—; ficha legible en https://webstore.iec.ch/en/publication/86756.
  # El estado de la revisión en curso **no está corroborado en fuente primaria** y no se afirma.
  # Cuidado al buscarlo: el «ISO/IEC DIS 25059:2022» que aparece en catálogos de revendedores es el
  # DIS de la primera edición, no el de la revisión (informe 2026-08-22, H2).
  - name: ISO IEC 25059:2023
    url: https://www.iso.org/standard/80655.html
    tier: standard
    topics: [ai-quality-model, product-quality-model]
  # Página de la certificación, no el anuncio: el syllabus vigente es v2.0 GA del 2026-04-17, y
  # anotarlo con su versión es lo que permite que la próxima corrida compare contra un documento y
  # no contra un titular (informe 2026-08-22, H3).
  - name: ISTQB CT-AI
    url: https://istqb.org/certifications/certified-tester-ai-testing-ct-ai/
    tier: profession
    topics: [ai-testing, probabilistic-oracles, metamorphic-testing, drift, red-teaming]
  # Pendientes de registrar en 2026-09: ISO/IEC 25002 (visión general) e ISO/IEC 25019
  # (calidad en uso). No se registran ahora porque no tengo su URL verificada, y
  # `require_primary_source: true` exige fuente primaria comprobada, no número de norma.
  - name: Playwright release notes
    url: https://playwright.dev/docs/release-notes
    tier: platform
    topics: [defaults, reintentos, reportes]
  - name: pytest changelog
    url: https://docs.pytest.org/en/stable/changelog.html
    tier: project
    topics: [defaults, plugins, deprecaciones]
