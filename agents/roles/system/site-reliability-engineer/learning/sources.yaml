version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/site-reliability-engineer.md dentro de cada instalación.
sources:
  - name: Google Site Reliability Engineering
    url: https://sre.google/sre-book/table-of-contents/
    tier: profession
    topics: [sre, availability, monitoring, incidents, capacity]
  - name: Google SRE Workbook on capacity and efficiency
    url: https://sre.google/workbook/table-of-contents/
    tier: profession
    topics: [slo, burn-rate, alerting, toil]
  - name: OpenSLO Specification
    url: https://openslo.com/
    tier: project
    topics: [services, sli, slo, alerts]
  - name: OpenTelemetry
    url: https://opentelemetry.io/docs/
    tier: project
    topics: [traces, metrics, logs, instrumentation]
