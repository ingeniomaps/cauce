version: 1
rules:
  require_primary_source: true
  require_version_platform_jurisdiction_and_community_fit: true
  require_consent_and_deidentification_for_member_evidence: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false
# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/community-manager.md dentro de cada instalación.
sources:
  - name: Contributor Covenant 3.0
    url: https://www.contributor-covenant.org/version/3/0/code_of_conduct/
    tier: project
    topics: [conduct, safety, reporting, enforcement]
  - name: GitHub community management and moderation
    url: https://docs.github.com/en/communities/setting-up-your-project-for-healthy-contributions/about-community-management-and-moderation
    tier: platform
    topics: [community, moderation, platform, tools]
  - name: W3C Web Content Accessibility Guidelines 2.2
    url: https://www.w3.org/TR/WCAG22/
    tier: standard
    topics: [accessibility, inclusion, web, conformance]
  - name: OECD privacy principles
    url: https://www.oecd.org/en/topics/privacy-principles.html
    tier: standard
    topics: [privacy, collection, purpose, use, accountability]
