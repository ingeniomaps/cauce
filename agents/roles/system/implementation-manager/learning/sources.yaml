version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_company_and_contract_fit: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false
# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/implementation-manager.md dentro de cada instalación.
sources:
  - name: ISO 21502 project management guidance
    url: https://www.iso.org/standard/74947.html
    tier: standard
    topics: [projects, governance, delivery, outcomes]
  - name: ISO 10005 quality plans
    url: https://www.iso.org/standard/70398.html
    tier: standard
    topics: [quality, plans, acceptance, revision]
  - name: ISO IEC 20000-1 service management
    url: https://www.iso.org/standard/70636.html
    tier: standard
    topics: [service, transition, delivery, improvement]
  - name: NIST CSF 2.0 Organizational Profiles
    url: https://www.nist.gov/cyberframework/profiles
    tier: standard
    topics: [security, current-profile, target-profile, gaps]
