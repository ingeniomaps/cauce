version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

sources:
  - name: Company entities data maps contracts policies and decisions
    url: local://privacy-compliance-context
    tier: company-primary
    topics: [entities, jurisdictions, data, vendors, controls, evidence]
  - name: Applicable official authorities and legislation
    url: local://jurisdiction-official-sources
    tier: legal-primary
    topics: [laws, regulations, guidance, effective-dates]
  - name: NIST Privacy Framework
    url: https://www.nist.gov/privacy-framework
    tier: primary-framework
    topics: [privacy-risk, governance, controls]
