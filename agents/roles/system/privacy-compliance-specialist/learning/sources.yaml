version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/privacy-compliance-specialist.md dentro de cada instalación.
sources:
  - name: NIST Privacy Framework
    url: https://www.nist.gov/privacy-framework
    tier: standard
    topics: [privacy-risk, governance, controls]
  - name: OECD Privacy Guidelines
    url: https://legalinstruments.oecd.org/public/doc/188/188.en.pdf
    tier: standard
    topics: [privacy-principles, accountability, transborder-data]
  - name: EUR-Lex GDPR
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
    tier: regulation
    topics: [eu-data-protection]
  - name: EDPB Guidelines on targeting and consent
    url: https://www.edpb.europa.eu/our-work-tools/general-guidance/guidelines-recommendations-best-practices_en
    tier: regulation
    topics: [eu-guidance, interpretation]
  # Versión 1.0 adoptada el 2026-07-07 (comunicado EDPB del 2026-07-08), en consulta pública hasta el
  # 2026-10-30. Test de tres criterios para "dato anónimo" — no aislamiento, no vinculación, no inferencia
  # — que incorpora la jurisprudencia del TJUE en C-413/23 P. No citar como estándar definitivo mientras
  # siga en consulta; releer la página oficial antes de tratarla como vigente (informe 2026-09-24, H5).
  - name: EDPB Guidelines 02/2026 on anonymisation
    url: https://www.edpb.europa.eu/public-consultations/guidelines-022026-on-anonymisation_en
    tier: regulation
    status: draft-in-consultation-until-2026-10-30
    topics: [data-minimization, anonymisation, eu-guidance]
  # Versión 1.0 adoptada el 2026-07-07 (mismo comunicado), en consulta pública hasta el 2026-10-30.
  # Sostiene que el consentimiento no es base viable a escala para datos scrapeados y que el interés
  # legítimo exige un test de tres partes. No citar como definitivo mientras siga en consulta (informe
  # 2026-09-24, H6).
  - name: EDPB Guidelines 03/2026 on web scraping for generative AI
    url: https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_2020603_webscraping_v1_en_0.pdf
    tier: regulation
    status: draft-in-consultation-until-2026-10-30
    topics: [ai-processing, web-scraping, eu-guidance]
  # Observatorio Legislativo del Parlamento Europeo, procedimiento 2025/0360(COD) — tramo de protección
  # de datos del Digital Omnibus VII. Declarada porque dos corridas consecutivas (informes 2026-10-02 y
  # 2026-10-24) tuvieron que rastrear este número de procedimiento desde cero; las páginas oficiales que
  # se intentaron antes (digital-strategy.ec.europa.eu, europarl.europa.eu/legislative-train) fallaron con
  # 500/403/vacío. Estado a la fecha del informe 2026-10-24 (no re-verificado desde entonces, así que antes
  # de citarlo hay que releer la página): el Consejo acordó mandato negociador el 21/10/2026 —Documentado
  # por tres fuentes secundarias concurrentes (iapp.org, y resultados de búsqueda de consilium.europa.eu y
  # agenceurope.eu), no Verificado contra el texto oficial, porque el comunicado del Consejo y el PDF
  # ST-14756-2026-INIT devuelven 403 o no se pueden decodificar—; el Parlamento Europeo todavía no fijó su
  # posición, así que esta misma ficha (que sigue el lado del Parlamento) sigue mostrando «Awaiting
  # committee decision» y no refleja el mandato del Consejo. El contenido detallado del mandato (definición
  # de dato personal, seudonimización, entrenamiento de IA, cookies) no se registra en ningún archivo del
  # cargo mientras sólo lo respalde `iapp.org`: es la misma distinción que exige el caso
  # `08-pending-guideline-finality` para una guía, aplicada acá a una fuente primaria inalcanzable. El RGPD
  # vigente (`eur-lex.europa.eu/eli/reg/2016/679/oj`, ya declarado arriba) sigue sin modificación: ningún
  # acto legislativo lo cambió todavía, y esta entrada no afirma lo contrario. No hay entrada separada para
  # `consilium.europa.eu`: bloqueó WebFetch con 403 o 500 en las dos corridas que lo intentaron; se agrega
  # el día que una corrida logre leerla.
  - name: Observatorio Legislativo del Parlamento Europeo — Digital Omnibus VII, tramo de protección de datos (2025/0360(COD))
    url: https://oeil.europarl.europa.eu/oeil/en/procedure-file?reference=2025%2F0360%28COD%29
    tier: regulation
    status: awaiting-committee-decision
    topics: [eu-data-protection, legislative-tracking]
