version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/software-architect.md dentro de cada instalación.
sources:
  - name: ISO IEC IEEE 42010
    url: https://www.iso.org/standard/74393.html
    tier: standard
    topics: [architecture-description, stakeholders, viewpoints]
  - name: C4 model
    url: https://c4model.com/
    tier: profession
    topics: [diagrams, context, containers, components, deployment]
  - name: SEI ATAM
    url: https://www.sei.cmu.edu/library/architecture-tradeoff-analysis-method-collection/
    tier: profession
    topics: [quality-attributes, scenarios, tradeoffs]
  - name: arc42
    url: https://arc42.org/
    tier: project
    topics: [architecture-documentation, decisions, risks]
