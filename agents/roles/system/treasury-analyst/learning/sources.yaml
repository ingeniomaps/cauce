version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: los bancos, procesadores, cuentas,
# umbrales y firmantes reales viven en organization/roles/treasury-analyst.md dentro de cada
# instalación, y el contrato con cada proveedor manda sobre cualquier fuente de esta lista.
sources:
  # Abierta el 2026-08-22, URL reemplazada el 2026-10 (H4, H5 del informe 2026-09-24): la URL original
  # pasó a describir sólo recertificación ("Maintaining Your Credential", verificado por fetch directo
  # el 2026-09-24) y dejó de enumerar los dominios del examen. Esta URL expone las especificaciones
  # vigentes del CTP (archivo "CTP-26_Test_Specifications", verificado por fetch directo el 2026-09-24)
  # con sus cinco dominios sobre 170 preguntas: (1) liquidez corporativa, 55-60; (2) estructura de
  # capital y costo del capital de largo plazo, 33-37; (3) relaciones internas y externas, 12-17;
  # (4) exposición a riesgo financiero, regulatorio y operacional, 23-27; (5) impacto de la tecnología
  # en tesorería, 23-27. La sub-ruta financialprofessionals.org/certification/ctp sigue devolviendo 500
  # (verificado 2026-09-24); por eso se cita la URL alternativa y no la del dominio principal.
  - name: AFP Certified Treasury Professional
    url: https://ctpcert.financialprofessionals.org/overview/ctp-test-specifications
    tier: profession
    topics: [treasury-management, liquidity, banking, international-treasury, treasury-technology]
  # Abierta el 2026-08-22. Define efectivo y equivalentes de efectivo y la clasificación en
  # operación, inversión y financiación.
  - name: IAS 7 Statement of Cash Flows
    url: https://www.ifrs.org/issued-standards/list-of-standards/ias-7-statement-of-cash-flows/
    tier: standard
    topics: [cash-and-equivalents, cash-flow-classification]
  # Abierta el 2026-08-22. Revelación de riesgo de liquidez, cualitativa y cuantitativa, sobre la
  # información que la dirección usa internamente.
  - name: IFRS 7 Financial Instruments Disclosures
    url: https://www.ifrs.org/issued-standards/list-of-standards/ifrs-7-financial-instruments-disclosures/
    tier: standard
    topics: [liquidity-risk, maturity-analysis, disclosure]
  # Abierta el 2026-08-22. La edición vigente es la de 2013, que reemplazó a la de 1992 el
  # 2014-12-15; la página lo dice y por eso el nombre lleva el año.
  - name: COSO Internal Control—Integrated Framework (2013)
    url: https://www.coso.org/guidance-on-ic
    tier: standard
    topics: [internal-control, segregation-of-duties, dual-approval]
  # Abierta el 2026-08-22. Versión final del 2012-04-16, CPMI-IOSCO. Alcance: infraestructuras de
  # mercado —sistemas de pago, CSD, CCP—, no una empresa no financiera. Se usa por su vocabulario
  # de riesgo de liquidez y firmeza de la liquidación, no como norma aplicable a la plataforma.
  - name: CPMI-IOSCO Principles for financial market infrastructures 2012
    url: https://www.bis.org/cpmi/publ/d101.htm
    tier: standard
    topics: [liquidity-risk, settlement-finality, payment-systems]
  # Abierta el 2026-08-22. Informe final del 2024-10-15 del programa de pagos transfronterizos
  # del G20: gobernanza y vigilancia de sistemas de pago rápido interconectados.
  - name: CPMI Linking fast payment systems across borders 2024
    url: https://www.bis.org/cpmi/publ/d223.htm
    tier: standard
    topics: [cross-border-payments, governance, multi-country]
  # Abierta el 2026-08-22. Lo leído en esa página es el preámbulo: el considerando 37 exige separar
  # los fondos del usuario de los de la entidad de pago. El texto del artículo 10 **no** se leyó
  # ahí, así que la exigencia se cita por el considerando y no por el articulado.
  - name: Directiva UE 2015/2366 PSD2
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32015L2366
    tier: regulation
    topics: [safeguarding, client-funds, payment-institutions]
  # Agregada el 2026-10 (H2 del informe 2026-09-24): el Consejo de la UE publicó el 2026-04-23 los
  # textos de compromiso final de PSD3 y el Reglamento de Servicios de Pago (PSR), que fusionan PSD2 y
  # la segunda Directiva de Dinero Electrónico y reemplazarán a PSD2. Registro: Documentado por
  # corroboración, no por lectura directa — consilium.europa.eu devolvió 403 el 2026-09-24; el hallazgo
  # se corrobora con seis publicaciones legales independientes (A&L Goodbody, Lexology ×2, Morrison
  # Foerster, PwC Legal, Arthur Cox, regulationtomorrow.com) que coinciden en fecha y contenido. A
  # 2026-09-24 todavía no hay adopción formal ni publicación en el Diario Oficial; una vez publicado el
  # período transitorio es de 18 meses. Mientras no se adopte, PSD2 sigue siendo la norma vigente para
  # custodia de fondos de terceros y esta fuente no la reemplaza — hacerlo no es automático: revisitar
  # tras la adopción formal, y ese día esta fuente pasa a reemplazar, no a complementar, a la de PSD2.
  - name: PSD3 / Reglamento de Servicios de Pago (PSR) — aún no adoptada
    url: https://www.consilium.europa.eu/en/press/press-releases/2026/04/23/
    tier: regulation
    status: not-yet-adopted
    topics: [safeguarding, client-funds, payment-institutions]
  # Abierta el 2026-08-22. PSA I-060923-PSA del 2023-06-09: "Use secondary channels or two-factor
  # authentication to verify requests for changes in account information."
  - name: FBI IC3 Business Email Compromise PSA I-060923-PSA
    url: https://www.ic3.gov/PSA/2023/PSA230609
    tier: standard
    topics: [payment-fraud, beneficiary-verification, out-of-band-verification]
  # Agregada el 2026-10 (H3 del informe 2026-09-24), opcional: aviso complementario del IC3, fechado
  # 2024-09-11, verificado por fetch directo el 2026-09-24. El propio texto se presenta como "an update
  # and companion piece to Business Email Compromise PSA [I-060923-PSA]" —la entrada de arriba— y
  # mantiene la misma recomendación de verificar por canal secundario o doble factor. No reemplaza a la
  # PSA de 2023: la corrobora con una fecha más reciente.
  - name: FBI IC3 Business Email Compromise PSA240911 (companion, 2024-09-11)
    url: https://www.ic3.gov/PSA/2024/PSA240911
    tier: standard
    topics: [payment-fraud, beneficiary-verification, out-of-band-verification]

# La norma local de cada país donde opera la empresa —custodia de fondos de terceros, límites de
# dispersión, horarios bancarios— no entra ni como pendiente: no es una fuente de la profesión, la
# registra cada instalación en organization/roles/treasury-analyst.md.
pending:
  - name: ISO 20022 mensajería de pagos
    url: https://www.iso20022.org/
    why: devuelve HTTP 403 (verificado 2026-09-24; antes agotaba el tiempo de espera), igual que
      swift.com/standards/iso-20022; sin la ficha del Registration Authority el contrato no cita
      nombres de mensaje (pain, pacs, camt). Swift pospuso de SR2026 a SR2027 (o una entrega
      posterior) todo el paquete de pagos transfronterizos —MT Category 1, CBPR+, SCORE+, SwiftGo—
      por adopción insuficiente de direcciones estructuradas (anuncio del 2026-08-27; Documentado por
      corroboración de cinco publicaciones de industria independientes, swift.com devolvió 403 el
      2026-09-24). El vencimiento ya no es 2026-11-14; queda por confirmar antes de fin de 2026 para
      el alcance de SR2027.
    since: 2026-08-22
  - name: GAFI FATF Recomendación 16 transferencias electrónicas
    url: https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html
    why: devolvió 403 en dos rutas; la obligación de datos de originador y beneficiario queda sin
      fuente propia y el contrato no afirma qué exige esa recomendación
    since: 2026-08-22
