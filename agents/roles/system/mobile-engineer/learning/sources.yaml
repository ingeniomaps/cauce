version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/mobile-engineer.md dentro de cada instalación.
sources:
  - name: Android Developers Core app quality
    url: https://developer.android.com/docs/quality-guidelines/core-app-quality
    tier: platform
    topics: [quality, compatibility, performance, security]
  - name: Apple Human Interface Guidelines
    url: https://developer.apple.com/design/human-interface-guidelines/
    tier: platform
    topics: [interaction, accessibility, privacy, platform-conventions]
  - name: OWASP Mobile Application Security
    url: https://mas.owasp.org/MASVS/
    tier: standard
    topics: [storage, authentication, network, platform, privacy]
  - name: W3C Mobile Accessibility
    url: https://www.w3.org/WAI/standards-guidelines/mobile/
    tier: standard
    topics: [accessibility, wcag, mobile]
