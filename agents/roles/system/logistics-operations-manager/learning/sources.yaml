version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: el catálogo de tipos de excepción, los
# acuerdos con cada transportadora y los plazos contratados viven en
# organization/roles/logistics-operations-manager.md dentro de cada instalación.
sources:
  # Reintento del 2026-09-24, para las dos entradas de GS1 que siguen: gs1.org/standards/epcis devolvió
  # 403 y ref.gs1.org/standards/epcis/ redirigió al PDF sin que el extractor de esa corrida lo
  # decodificara. La edición que estas dos entradas citan —Release 2.0, ratificada en junio de 2022— es
  # la leída el 2026-08-22 y no se re-confirmó. Una búsqueda mencionó una «EPCIS 2.1» en preparación sin
  # citar fuente primaria: queda como hipótesis, no sostiene nada y no cambia ninguna de las dos.
  # Verificado el 2026-08-22: la URL entrega el PDF de la norma; su portada dice «EPCIS Standard,
  # Release 2.0, Ratified, Jun 2022». Define el evento de visibilidad y el elemento `ErrorDeclaration`,
  # que es cómo se corrige un evento ya emitido sin borrarlo.
  - name: GS1 EPCIS Standard 2.0
    url: https://ref.gs1.org/standards/epcis/
    tier: standard
    topics: [visibility-events, event-chronology, error-declaration]
  # Verificado el 2026-08-22: misma ruta, portada «Core Business Vocabulary (CBV) Standard, Release 2.0,
  # Ratified, Jun 2022». Se leyeron las listas de `disposition` —incluye `in_transit`, `damaged`,
  # `destroyed`— y la regla del campo `reason` de `ErrorDeclaration`. Es referencia para diseñar la
  # homologación de códigos crudos, no un catálogo que las transportadoras usen por defecto.
  - name: GS1 Core Business Vocabulary 2.0
    url: https://ref.gs1.org/standards/cbv/
    tier: standard
    topics: [disposition-codes, business-steps, exception-vocabulary]
  # Verificado el 2026-08-22: «The Kanban Guide», mayo de 2025. Cita literal de Work Item Age —«the
  # elapsed time between when a work item started and the current date»— y de la Service Level
  # Expectation como pronóstico con período y probabilidad. Es la base de medir la cola por espera.
  - name: The Kanban Guide (2025-05)
    url: https://kanbanguides.org/english/
    tier: profession
    topics: [flow-metrics, work-item-age, service-level-expectation, wip]
  # Verificado el 2026-08-22: Resolución 3038 de 2011 de la CRC, del 2011-04-04, Diario Oficial 48.033,
  # «Régimen de Protección de los Derechos de los Usuarios de los Servicios Postales». Cubre PQR,
  # indemnización por pérdida o avería, publicación de tiempos de entrega y devolución al remitente del
  # objeto no entregado. El propio texto anota su compilación en la Resolución CRC 5050 de 2016.
  # Alcance: servicios postales en Colombia. No se extiende a transporte de carga ni a otro país.
  - name: Resolución CRC 3038 de 2011 (Colombia)
    url: https://normograma.crcom.gov.co/crc/compilacion/docs/resolucion_crc_3038_2011.htm
    tier: regulation
    topics: [postal-user-rights, claims, indemnification, delivery-times, undelivered-items]
  # Verificado el 2026-08-22 (CUN) y completado el 2026-10-02: el título completo de la resolución es
  # «Por la cual se compilan las Resoluciones de Carácter General vigentes expedidas por la Comisión de
  # Regulación de Comunicaciones», y no existe un título dedicado a protección de usuarios postales — el
  # régimen vive dentro del Título II general, «Medidas para la Protección de los Usuarios de los
  # Servicios de Comunicaciones». La definición del CUN —el código con el que el usuario sigue su PQR o
  # su solicitud de indemnización— sigue siendo la leída el 2026-08-22. Pendiente, sin abrir: la
  # remisión al Decreto 1078 de 2015, art. 2.2.13.3.5, que la Resolución CRC 3038/2011 cita (ver
  # `pending` más abajo).
  - name: Resolución CRC 5050 de 2016 (Colombia, compilatoria)
    url: https://gestornormativo.creg.gov.co/gestor/entorno/docs/resolucion_crc_5050_2016.htm
    tier: regulation
    topics: [postal-user-rights, cun, claims]
  # Verificado el 2026-08-22: la página lista las Actas vigentes —Constitución (Abiyán 2021), Reglamento
  # General (Riad 2023), Convenio Postal Universal y su Protocolo Final (Riad 2023), Acuerdo de Servicios
  # Postales de Pago y los Reglamentos—. Los artículos concretos sobre reclamaciones **no se leyeron**;
  # sólo consta qué actos están en vigor y de qué Congreso.
  - name: Actos de la UPU en vigor
    url: https://www.upu.int/en/universal-postal-union/about-upu/acts
    tier: regulation
    topics: [cross-border-postal, convention, claims]
  # Verificado el 2026-10-02: página `committee.iso.org/standard/71580.html` abierta con WebFetch.
  # ISO 10002:2018, tercera edición (2018-07), «This publication was last reviewed and confirmed in
  # 2023. Therefore this version remains current», estado vigente; la ISO 10002:2014 aparece retirada
  # y reemplazada por ésta. Norma internacional de gestión de calidad para el tratamiento de quejas,
  # sin jurisdicción propia: referencia de proceso para este cargo, no obligación legal en ningún país.
  # El cuerpo de la norma sigue sin abrirse —acceso de pago—, así que esta entrada describe la ficha
  # (edición, año, estado), no sus cláusulas.
  - name: ISO 10002
    url: https://committee.iso.org/standard/71580.html
    tier: standard
    topics: [complaints-handling]
  # Verificado el 2026-10-24: govinfo.gov/content/pkg/FR-2026-04-21/html/2026-07679.htm (Federal
  # Register, aviso «Inbound Parcel Post (at UPU Rates)», documento 2026-07679), abierto con WebFetch.
  # «beginning in CY 2027 designated operators will be required to provide an ancillary international
  # proof of delivery», con cita a los artículos 18.3.3 y 33.8 del Convenio Postal Universal enmendado
  # en Dubái 2025; vigencia 2027-01-01. Es una fuente secundaria oficial (el regulador postal de
  # EE. UU.) que describe la enmienda, no el texto del Convenio en sí —ese PDF sigue sin decodificarse—,
  # así que la cita de los artículos es documentada por esta fuente y no verificada contra el texto
  # primario de la UPU. Alcanza, en lo verificado, a la implementación de EE. UU.; no se comprobó si
  # otro país miembro ya publicó la suya.
  - name: Federal Register 2026-07679 — Inbound Parcel Post (at UPU Rates)
    url: https://www.govinfo.gov/content/pkg/FR-2026-04-21/html/2026-07679.htm
    tier: regulation
    topics: [visibility-events, proof-of-delivery, cross-border-postal]
  # Verificado el 2026-10-24: govinfo.gov/content/pkg/FR-2025-11-25/html/2025-21089.htm (Federal
  # Register, «International Registered Mail», documento 2025-21089) y
  # about.usps.com/postal-bulletin/2025/pb22690/html/updt_004.htm, abiertas con WebFetch. Desde el
  # 2026-01-01 (decisión del Congreso Extraordinario de la UPU de octubre de 2023, no de Dubái 2025) el
  # Registered Mail internacional de EE. UU. queda restringido a piezas de First-Class Mail
  # International con documentos únicamente, y la indemnización máxima por pérdida, avería o contenido
  # faltante es de USD 40,20. Específico del Servicio Postal de EE. UU.: el Convenio deja el monto y la
  # disponibilidad del servicio a cada operador designado. Vigente ya hace diez meses a la fecha de esta
  # entrada, no una fecha futura.
  - name: Federal Register 2025-21089 y boletín USPS pb22690 — Registered Mail internacional (EE. UU.)
    url: https://www.govinfo.gov/content/pkg/FR-2025-11-25/html/2025-21089.htm
    tier: regulation
    topics: [indemnification, claims]
pending:
  - name: Ley Federal de Protección al Consumidor (México)
    url: https://www.diputados.gob.mx/LeyesBiblio/pdf/LFPC.pdf
    why: la conexión ya no es el bloqueo. El 2026-09-24 esta URL y el espejo de Profeco
      (profeco.gob.mx/juridico/pdf/l_lfpc_ultimo_camdip.pdf) conectaron y entregaron el PDF, y esta URL
      volvió a hacerlo el 2026-10-02 y el 2026-10-24; lo que falla es que el extractor no decodifica
      el flujo comprimido a texto. Es un bloqueo de herramienta y no de acceso. El 2026-10-24 se
      encontró un mirror distinto que sí decodifica —ordenjuridico.gob.mx/Documentos/Federal/html/wo12974.html—,
      con pie «Última reforma: 26 de junio de 2017»: con esa versión se leyeron los artículos 14
      (prescripción de un año), 74 (entrega en el plazo pactado) y 77 (garantía mínima de sesenta días).
      No se sabe si este mirror de 2017 coincide con el texto vigente hoy —la LFPC pudo tener reformas
      posteriores que no refleja, y el PDF que sí sería la versión vigente sigue sin poder leerse—. Esta
      entrada pasa de «sin leer nada» a «hay una versión parcial y fechada, de antigüedad desconocida».
    since: 2026-08-22
  - name: ASCM SCOR DS procesos Deliver y Return
    url: https://www.ascm.org/globalassets/documents--files/corporate-transformation/scor-ds-digital-guide_final.pdf
    why: la página ya no devuelve vacío. El 2026-09-24 esta URL —la guía digital del modelo— conectó y
      entregó el PDF; lo que falla ahora es la decodificación del flujo comprimido, igual que con la
      LFPC. Sigue en pie la otra mitad del motivo original: el modelo completo es de acceso pago, así
      que esta guía puede ser todo lo que llegue a haber y la entrada puede no cerrarse nunca.
      Reintentado el 2026-09-24.
    since: 2026-08-22
  - name: 49 CFR Part 370 reclamaciones ante transportistas (EE. UU.)
    url: https://www.ecfr.gov/current/title-49/subtitle-B/chapter-III/subchapter-B/part-370
    why: «Principles and Practices for the Investigation and Voluntary Disposition of Loss and Damage
      Claims and Processing Salvage», aplicable a transportistas motorizados y freight forwarders en
      comercio interestatal o exterior (título oficial establecido el 2026-10-24). eCFR redirige a un
      portal de desbloqueo y no entrega el texto; reabierto el 2026-09-24, el 2026-10-02 y el
      2026-10-24, sin cambio. El 2026-10-02 se abrió además ese destino
      (unblock.federalregister.gov): no es una redirección genérica, es una página de verificación
      anti-automatización («programmatic access to these sites is limited to access to our extensive
      developer APIs»). El 2026-10-24 se probó un volumen en PDF de govinfo.gov
      (CFR-2022-title49-vol5-sec370-3.pdf): tampoco decodificó. govinfo.gov sirve el mismo volumen en XML
      (`CFR-2022-title49-vol5/xml/CFR-2022-title49-vol5-part370.xml`), que devolvió texto legible el
      2026-11-05. Es la edición anual al 2022-10-01, no la vigente: la próxima corrida busca por esa
      ruta la edición más reciente.
    since: 2026-08-22
  - name: Decisiones del 28º Congreso de la UPU (Dubái, 2025)
    url: https://www.upu.int/UPU/media/upu/files/aboutUpu/acts/07-actsAndOtherDecisions2025DubaiCongress/2025DubaiCongressDecisionsEn.pdf
    why: las Actas vigentes siguen siendo las de Abiyán 2021 enmendadas en Riad 2023 —verificado el
      2026-09-24, el 2026-10-02 y el 2026-10-24 sobre la página de Actos ya declarada arriba— y esta
      entrada no las discute. El PDF de decisiones del 28º Congreso sigue sin decodificarse: tercera
      corrida consecutiva con el mismo bloqueo (2026-09-24, 2026-10-02, 2026-10-24). Una búsqueda sobre
      este mismo tema repitió «1 de enero de 2027» como fecha de entrada en vigor del Duodécimo
      Protocolo Adicional a la Constitución y del Segundo Protocolo Adicional al Convenio, pero el
      2026-10-24 esa misma clase de búsqueda produjo tres datos concretos falsos sobre un tema
      relacionado (ver las entradas «Federal Register 2026-07679» y «Federal Register 2025-21089» de
      `sources:`): esa fecha sigue
      en hipótesis, sin corroborar contra una fuente primaria o secundaria legible, y repetirse no la
      vuelve más confiable. A diferencia de ella, la vigencia 2027-01-01 de la entrada «Federal Register
      2026-07679» de `sources:` sí viene de una fuente abierta y verificada, y cubre sólo
      la prueba de entrega de paquetería, no el régimen completo de reclamaciones. La próxima corrida
      mensual sigue contestando una sola pregunta: ¿los Protocolos Adicionales ya rigen, y tocan
      reclamaciones o indemnización transfronteriza más allá de la prueba de entrega?
    since: 2026-09-24
  - name: Decreto 1078 de 2015, artículo 2.2.13.3.5 (Colombia)
    url: https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=77888
    why: remisión de la Resolución CRC 3038/2011, registrada el 2026-10-02 sin abrir. Dos intentos el
      2026-10-24, ninguno sirvió el texto: esta URL (funcionpublica.gov.co) dio error de certificado TLS
      («unable to verify the first certificate»), y
      https://www.cancilleria.gov.co/normograma/compilacion/docs/decreto_1078_2015.htm dio HTTP 403. La
      próxima corrida prueba una tercera vía en vez de repetir estas dos.
    since: 2026-10-24
  - name: Reforma postal de la Unión Europea («EU Delivery Act»)
    url: https://www.cep-research.com/2025/10/23/eu-wants-feedback-on-postal-regulation-overhaul/
    why: fuente secundaria (no oficial de la UE), abierta el 2026-10-24 — describe que la Comisión busca
      fusionar la Directiva 97/67/EC y el Reglamento 2018/644 sobre entrega transfronteriza en una nueva
      «EU Delivery Act», con una consulta pública («October 6» a «November 14, 2025»). Dos intentos de
      abrir el documento primario de la Comisión (COM(2025) 506 final, PDF y HTML en eur-lex.europa.eu)
      y la página del Parlamento Europeo sobre este expediente devolvieron respuesta vacía. La URL de la
      fuente secundaria lleva fecha de octubre de 2025 pese a describirse como vigente en esta búsqueda
      de octubre de 2026 —discrepancia de un año sin resolver—. No hay texto primario legible y no es
      derecho vigente todavía, pero es el primer indicio de un régimen de reclamaciones e indemnización
      a nivel de la Unión Europea que este catálogo no cubre en ningún país miembro.
    since: 2026-10-24
