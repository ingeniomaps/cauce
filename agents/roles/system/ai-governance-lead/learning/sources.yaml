version: 1
rules:
  require_primary_source: true
  require_version_status_jurisdiction_role_and_application_date: true
  require_legal_review_for_legal_interpretation: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false
# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/ai-governance-lead.md dentro de cada instalación.
sources:
  - name: NIST Artificial Intelligence Risk Management Framework 1.0
    url: https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-ai-rmf-10
    tier: standard
    topics: [ai-risk, govern, map, measure, manage]
  - name: ISO IEC 42001:2023 AI management system
    url: https://webstore.iec.ch/en/publication/90574
    tier: standard
    topics: [ai-governance, management-system, accountability, improvement]
  - name: ISO IEC 42005:2025 AI system impact assessment
    url: https://webstore.iec.ch/en/publication/107659
    tier: standard
    topics: [impact-assessment, individuals, groups, society, lifecycle]
  - name: ISO IEC 42006:2025 AIMS audit and certification body requirements
    url: https://webstore.iec.ch/en/publication/108460
    tier: standard
    topics: [ai-governance, certification, audit, accreditation]
  - name: OECD AI Principles updated 2024
    url: https://oecd.ai/en/ai-principles
    tier: standard
    topics: [human-rights, transparency, robustness, accountability, sustainability]
  - name: European Commission AI Act policy page
    url: https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai
    tier: regulation
    topics: [eu, regulation, roles, risk, transparency, timeline]
  - name: EU Artificial Intelligence Act legal text
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
    tier: regulation
    topics: [eu, legal-text, prohibited, high-risk, gpai, obligations]
  - name: Digital Omnibus on AI — Regulation (EU) 2026/1744 (amends Regulation (EU) 2024/1689)
    url: https://eur-lex.europa.eu/eli/reg/2026/1744/oj
    tier: regulation
    topics: [eu, regulation, timeline, amendment]
    # Texto primario: EUR-Lex (HTML, PDF y la variante "/eng" de esta misma URL) no devolvió contenido
    # legible en la corrida de investigación de 2026-09-24. Lo que sigue sale de fuentes jurídicas
    # secundarias (Orrick, Gibson Dunn) y queda en registro Documentado, no Verificado (R14):
    # Anexo III de alto riesgo pasa a aplicar el 2026-12-02 -> 2027-12-02; Anexo I (IA embebida en
    # producto ya regulado) a 2028-08-02; y el Art. 5 suma dos prohibiciones nuevas —imágenes íntimas no
    # consentidas y CSAM— desde 2026-12-02. No tocó las prohibiciones del Art. 5 ya vigentes desde
    # 2025-02-02, las obligaciones de proveedores GPAI desde 2025-08-02 ni la transparencia del Art. 50
    # desde 2026-08. La fecha de adopción no es una discrepancia sin resolver entre dos fuentes: son
    # hitos distintos del mismo proceso legislativo, cada uno en su propio registro. Propuesta de la
    # Comisión adoptada el 2025-11-19 (Verificado, digital-strategy.ec.europa.eu); acuerdo político
    # (Parlamento/Consejo) el 2026-05-07 (Verificado, misma fuente); firma del reglamento el 2026-07-08
    # (Documentado, lawandtechnology.eu); publicación en el Diario Oficial el 2026-07-24 (Documentado,
    # misma fuente); entrada en vigor el 2026-07-27 (Verificado, digital-strategy.ec.europa.eu). Ninguna
    # fecha en Documentado pasa a Verificada sin confirmar contra el texto primario o con Legal.
    # Dos hitos más del mismo proceso, ambos Documentado: el Parlamento Europeo votó el 2026-06-16, 423 a
    # favor / 57 en contra / 174 abstenciones, y el Consejo adoptó formalmente el texto el 2026-06-29
    # (licentium.io e iubenda.com, ambas fetcheadas directamente). `digital-strategy.ec.europa.eu` — la
    # fuente que corrobora los hitos en Verificado arriba — devolvió HTTP 403 en la corrida que buscó una
    # tercera confirmación de estos dos, así que quedan en Documentado sin esa tercera fuente.
    # El Art. 4 (AI literacy) también se modificó: el deber de un "nivel suficiente" de AI literacy se
    # reemplaza por medidas contextuales que apoyen su desarrollo, vigente desde el 2025-02-02 igual que
    # antes de la enmienda (Documentado, casys.ai, corroborado por un segundo resultado de búsqueda
    # independiente —getactready.com—, no Verificado).
    # El Art. 27 (FRIA, evaluación de impacto en derechos fundamentales) amplía sus flexibilidades
    # (Documentado, iapp.org, fuente única fetcheada directamente; un segundo resultado de búsqueda
    # agregado menciona lo mismo sin URL puntual identificada). No alcanza el estándar de dos fuentes
    # puntuales fetcheadas que usa el resto de esta entrada: falta fetchear una segunda fuente puntual
    # (p. ej. freshfields.com o legal500.com) antes de usarlo sin este hedge adicional.
    # El desglose estructural del Digital Omnibus (artículos tocados, anexos modificados, artículos
    # nuevos insertados) tiene dos series de cifras contradictorias entre fuentes secundarias y ninguna
    # sale del texto primario: queda fuera de este registro hasta poder abrir EUR-Lex o confirmar con
    # Legal.
