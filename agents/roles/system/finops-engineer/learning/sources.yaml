version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/finops-engineer.md dentro de cada instalación.
sources:
  - name: FinOps Foundation Framework
    url: https://www.finops.org/framework/
    tier: professional-primary
    topics: [capabilities, allocation, forecasting, governance]
  - name: FOCUS billing data specification
    url: https://focus.finops.org/
    tier: standards-primary
    topics: [billing, schema, normalization, comparison]
  - name: Google SRE Workbook on capacity and efficiency
    url: https://sre.google/workbook/table-of-contents/
    tier: primary-method
    topics: [capacity, reliability, tradeoffs, toil]
  - name: Anthropic pricing and token accounting documentation
    url: https://docs.anthropic.com/en/docs/about-claude/pricing
    tier: platform-primary
    topics: [tokens, caching, context, models]
