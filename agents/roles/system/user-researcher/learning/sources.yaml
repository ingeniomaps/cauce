version: 1
rules:
  require_primary_source: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

sources:
  - name: GOV.UK User Research
    url: https://www.gov.uk/service-manual/user-research
    tier: public-standard
    topics: [planning, consent, privacy, recruitment, analysis]
  - name: Nielsen Norman Group
    url: https://www.nngroup.com/articles/
    tier: primary-practitioner
    topics: [methods, usability, synthesis]
  - name: UK Government Social Research Ethics
    url: https://www.gov.uk/government/publications/government-social-research-framework-for-research-ethics
    tier: public-standard
    topics: [ethics, harm, consent]
  - name: Interaction Design Foundation
    url: https://www.interaction-design.org/literature/topics/user-research
    tier: secondary-practitioner
    topics: [methods, bias, synthesis]
