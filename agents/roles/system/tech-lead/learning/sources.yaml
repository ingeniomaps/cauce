version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: quién firma qué, qué se escala y a
# quién vive en organization/roles/tech-lead.md dentro de cada instalación.
#
# Las diez fuentes de abajo se abrieron en la revisión del 2026-08-22 y las diez devolvieron 200. Lo
# comprobado es que la URL responde y que el título de la página es el que se cita; el texto completo
# se leyó sólo en las marcadas con «leída».
sources:
  # Leída. Es la raíz de la guía; las tres siguientes son sus páginas. El repositorio
  # (github.com/google/eng-practices) está archivado por su dueño desde 2025-11-21 y es de sólo
  # lectura —últimos commits sobre `review/`: 2024-05-10—, así que mientras siga archivado es un
  # snapshot congelado: no hace falta reabrir estas cuatro páginas buscando cambios salvo que
  # Google la desarchive o publique un reemplazo (documentado en el informe del 2026-09-24, H1).
  - name: Google Code Review Developer Guide
    url: https://google.github.io/eng-practices/review/
    tier: profession
    topics: [design-review, approval-criteria, reviewer-role]
  - name: Google — The Standard of Code Review
    url: https://google.github.io/eng-practices/review/reviewer/standard.html
    tier: profession
    topics: [approval-criteria, blocking-vs-nit, improvement-over-perfection]
  - name: Google — Handling pushback in code reviews
    url: https://google.github.io/eng-practices/review/reviewer/pushback.html
    tier: profession
    topics: [disagreement, escalation, author-reviewer-conflict]
  # Leída. Sostiene la regla de que una revisión que tarda es una decisión, no una demora neutra.
  - name: Google — Speed of Code Reviews
    url: https://google.github.io/eng-practices/review/reviewer/speed.html
    tier: profession
    topics: [review-latency, batch-size, team-velocity]
  # Leída (encabezado y resumen). RFC 7282, Informational, junio de 2014, P. Resnick. De acá sale la
  # distinción entre consenso áspero y mayoría, y el trato de la objeción no atendida.
  - name: RFC 7282 — On Consensus and Humming in the IETF
    url: https://www.rfc-editor.org/rfc/rfc7282.html
    tier: standard
    topics: [rough-consensus, unaddressed-objections, technical-disagreement]
  # La página responde 200 con el título «Apache Voting Process». El detalle del veto técnico y de la
  # carga de justificarlo está en esa página pero no se citó línea por línea en esta corrida.
  - name: Apache Voting Process
    url: https://www.apache.org/foundation/voting.html
    tier: profession
    topics: [technical-veto, lazy-consensus, decision-records]
  - name: PEP 1 — PEP Purpose and Guidelines
    url: https://peps.python.org/pep-0001/
    tier: profession
    topics: [designated-decider, proposal-states, decision-process]
  # Leída. Es la fuente de la segregación entre quien escribe y quien aprueba, y de que la aprobación
  # externa al equipo no mejora la tasa de fallo. La investigación que cita es el State of DevOps 2019.
  - name: DORA — Streamlining change approval
    url: https://dora.dev/capabilities/streamlining-change-approval/
    tier: profession
    topics: [peer-review, segregation-of-duties, change-approval, cab]
  # Nombre vigente desde 4.0.0 (2024-09-17): la página oficial revirtió el acrónimo al de origen
  # —«Markdown Architectural Decision Records»— después de haber usado «Markdown Any Decision
  # Records» entre 2022-05-17 (3.0.0-beta) y 2024-09-02 (documentado por la sección «News» de
  # adr.github.io/madr/, verificada en el informe del 2026-09-24, H2).
  - name: MADR — Markdown Architectural Decision Records
    url: https://adr.github.io/madr/
    tier: profession
    topics: [decision-records, options, consequences]
  # La ficha del IEEE SA devuelve el título «IEEE/ISO/IEC 42010-2022», que es lo que confirma la
  # identidad y la edición. iso.org devuelve 403 —igual que en la revisión de qa-engineer del
  # 2026-08-16—, así que el texto de la norma no se leyó: entra como delimitación de lo que este cargo
  # consume como restricción, no como fuente de procedimiento.
  - name: IEEE/ISO/IEC 42010-2022
    url: https://standards.ieee.org/ieee/42010/6846/
    tier: standard
    topics: [architecture-description, architecture-decisions, scope-boundary]
  # Inactive-Reserved desde 2019-11-07: la ficha con JavaScript (/ieee/1028/4266/, la que esta lista
  # tenía como pendiente) devuelve 404 desde al menos 2026-09-24; la ficha alternativa sin
  # JavaScript de la misma norma sí carga completa y declara ese estado. No es norma vigente: se
  # cita sólo como referencia histórica de la taxonomía de revisiones (management review,
  # technical review, inspection, walkthrough, audit), nunca para remitir un requisito de proceso
  # activo (documentado en el informe del 2026-09-24, H3).
  - name: IEEE 1028-2008 — Software Reviews and Audits (inactiva desde 2019-11-07)
    url: https://standards.ieee.org/standard/1028-2008.html
    tier: standard
    topics: [review-taxonomy, inspection, walkthrough, audit, historical-reference]

pending:
  - name: ISO IEC IEEE 24765 vocabulario de ingeniería de software
    why: fijaría los términos «revisión técnica» y «auditoría»; las dos URL primarias de iso.org
      (/standard/71952.html, edición 2017; /standard/92875.html, committee draft de una revisión
      en curso) siguen en 403 en la tercera corrida consecutiva (2026-08-16, 2026-08-22,
      2026-09-24). La edición 2017 consta como documentada —no verificada en fuente primaria— por
      ANSI webstore e IEEE Xplore.
    since: 2026-08-22
