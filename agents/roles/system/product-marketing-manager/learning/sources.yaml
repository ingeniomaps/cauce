version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/product-marketing-manager.md dentro de cada instalación.
sources:
  - name: Product Marketing Alliance
    url: https://www.productmarketingalliance.com/
    tier: profession
    topics: [positioning, messaging, gtm, launches, enablement]
  - name: ICC Advertising Code
    url: https://iccwbo.org/business-solutions/the-icc-advertising-and-marketing-communications-code/
    tier: standard
    topics: [responsible-marketing, substantiation, transparency]
  - name: FTC Advertising and Marketing
    url: https://www.ftc.gov/business-guidance/advertising-marketing
    tier: regulation
    topics: [claims, endorsements, disclosures]
  - name: Strategyzer Value Proposition Canvas
    url: https://www.strategyzer.com/library/the-value-proposition-canvas
    tier: profession
    topics: [customer-needs, value-proposition]
