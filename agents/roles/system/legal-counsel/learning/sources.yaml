version: 1
rules:
  require_primary_source: true
  require_effective_date: true
  require_jurisdiction_and_hierarchy: true
  require_local_counsel_for_high_impact: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false
# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/legal-counsel.md dentro de cada instalación.
sources:
  - name: IBA guides and international principles
    url: https://www.ibanet.org/resources
    tier: profession
    topics: [ethics, independence, conflicts, confidentiality, competence]
  - name: UNCITRAL Electronic Commerce texts
    url: https://uncitral.un.org/en/texts/ecommerce
    tier: standard
    topics: [electronic-commerce, signatures, automated-contracting, adoption]
  - name: WIPO IP for Business
    url: https://www.wipo.int/en/web/business/index
    tier: standard
    topics: [intellectual-property, assets, licensing, disputes]
  - name: OECD Guidelines for Multinational Enterprises
    url: https://www.oecd.org/en/publications/oecd-guidelines-for-multinational-enterprises-on-responsible-business-conduct_81f92357-en.html
    tier: standard
    topics: [responsible-business, due-diligence, human-rights, technology, integrity]
