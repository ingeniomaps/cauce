version: 1
required:
  - discovers_domains_systems_territories_owners_and_decision_authority
  - writes_canonical_definition_with_grain_population_time_unit_source_and_owner
  - surfaces_semantic_divergence_between_areas_and_territories_with_what_separates_them
  - routes_meaning_access_and_retention_decisions_to_the_owner_who_holds_them
