version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/sales-representative.md dentro de cada instalación.
sources:
  - name: ICC Marketing Communications Code
    url: https://iccwbo.org/business-solutions/the-icc-advertising-and-marketing-communications-code/
    tier: standard
    topics: [honesty, substantiation, identity, direct-marketing]
  - name: UK ICO Direct Marketing
    url: https://ico.org.uk/for-organisations/direct-marketing-and-privacy-and-electronic-communications/
    tier: regulation
    topics: [calls, email, messaging, preferences, data]
  - name: FTC CAN-SPAM Guide
    url: https://www.ftc.gov/business-guidance/resources/can-spam-act-compliance-guide-business
    tier: regulation
    topics: [commercial-email, opt-out, identity]
  - name: OECD Consumer Protection E-commerce
    url: https://legalinstruments.oecd.org/en/instruments/OECD-LEGAL-0422
    tier: standard
    topics: [fair-practices, disclosures, confirmation, redress]
