version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/fraud-risk-analyst.md dentro de cada instalación. Tampoco lo es la
# documentación de un proveedor de scoring sobre su propio producto: eso es afirmación de
# parte, se cita como suya y no calibra nada.
sources:
  # Artículo 22 leído literal en el texto consolidado de EUR-Lex el 2026-08-22. El apartado 3
  # es el que fija el piso de la revisión: «the right to obtain human intervention on the part
  # of the controller, to express his or her point of view and to contest the decision».
  - name: GDPR art. 22 (Reglamento UE 2016/679)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32016R0679
    tier: regulation
    topics: [automated-decision, human-review, contestability, profiling]
  # Anexo III punto 5(b) leído literal el 2026-08-22: los sistemas que evalúan solvencia son de
  # alto riesgo «with the exception of AI systems used for the purpose of detecting financial
  # fraud». La excepción acota la obligación legal; no dice que el modelo no decida sobre personas.
  #
  # Actualización 2026-09-24: el Reglamento (UE) 2026/1744 (Digital Omnibus on AI), recital 40,
  # pospuso la fecha de aplicación de las obligaciones de alto riesgo del anexo III de 2026-08-02 a
  # 2027-12-02 — verificado, EUR-Lex, leído literal. Un borrador de directrices de la Comisión,
  # todavía no adoptado (página oficial, última actualización 2026-07-23, etiqueta «Draft»),
  # interpreta la excepción de forma restrictiva: sólo alcanza a un sistema cuyo uso previsto
  # **principal** sea detectar fraude —si la detección es un componente de un sistema mayor de
  # evaluación de solvencia, ese sistema mayor sigue siendo de alto riesgo salvo que la parte de
  # fraude sea standalone—, y no hay excepción equivalente para seguros de vida y salud. Esto va
  # documentado por fuente secundaria (Global Policy Watch, junio 2026), contenido del borrador no
  # confirmado contra el PDF de la Comisión, y no vinculante mientras siga en borrador.
  #
  # Actualización 2026-10-24: dos fuentes secundarias independientes (enz.ai y srd-rechtsanwaelte.de,
  # ambas leídas 2026-10-24) coinciden en una previsión de adopción de las directrices finales «para
  # fines de 2026», y ninguna de las dos cita un cronograma oficial publicado — documentado, no
  # verificado; la página oficial de la Comisión no se pudo leer en esta corrida (HTTP 403).
  - name: AI Act (Reglamento UE 2024/1689), anexo III 5(b)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202401689
    tier: regulation
    topics: [high-risk-classification, fraud-detection-exception, ai-governance]
  # Artículo 68.2 a 68.4 leído literal el 2026-08-22: razones «objectively justified», deber de
  # informar al titular del bloqueo y de sus razones, y deber de desbloquear cuando la razón deja
  # de existir. Es el modelo de contención reversible que este cargo propone.
  #
  # Actualización 2026-10-02: PSD3/PSR (la directiva y el reglamento en trámite que eventualmente
  # reemplazan a PSD2) todavía no votó su plenario. El Observatorio Legislativo del Parlamento
  # Europeo lista el 2026-12-14 como fecha indicativa (no confirmada) de ese voto, según una nota de
  # clearingpost.com del 2026-09-03 — documentado por fuente secundaria, leído 2026-10-02; las dos
  # páginas del expediente del Observatorio no devolvieron contenido al fetch automatizado en ninguna
  # corrida. Un voto de diciembre empujaría la aplicación plena del PSR hacia mediados de 2028. Hasta
  # que eso ocurra, el art. 68 de PSD2 de arriba sigue siendo el fundamento vigente de este cargo para
  # el bloqueo reversible de instrumentos de pago.
  - name: PSD2 art. 68 (Directiva UE 2015/2366)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32015L2366
    tier: regulation
    topics: [payment-instrument-blocking, notification, unblocking, fraud-suspicion]
  # Circular 2022-03 del 2022-05-26. Alcance: crédito bajo ECOA y Regulation B en EE. UU., no
  # fraude. Se registra por el principio que sí se traslada —la opacidad del modelo no reduce lo
  # que hay que explicar—, y ese alcance se dice cada vez que se la cita.
  #
  # Retirada el 2025-05-12, junto con otros 66 documentos de guía de la CFPB, en un retiro
  # administrativo en bloque (verificado: ausencia en el listado vigente de
  # consumerfinance.gov/compliance/circulars/, 2026-09-24; documentado por fuente secundaria
  # —Venable LLP, "CFPB Withdraws Guidance Documents"— el detalle del retiro en bloque, ya que el
  # aviso del Federal Register no se dejó leer como texto). El retiro no deroga las obligaciones de
  # ECOA/Regulation B de dar razones específicas de una decisión adversa; el principio que este
  # cargo traslada sigue en pie. Citarla hoy sin esta nota es citar un documento retirado como si
  # fuera guía vigente de la CFPB — el mismo patrón que ya corrige la nota de SR 11-7 en la entrada
  # de SR 26-2, de abajo.
  - name: CFPB Consumer Financial Protection Circular 2022-03
    url: https://www.consumerfinance.gov/compliance/circulars/circular-2022-03-adverse-action-notification-requirements-in-connection-with-credit-decisions-based-on-complex-algorithms/
    tier: regulation
    topics: [adverse-action, black-box-models, specific-reasons, explainability]
  # Publicada el 2026-04-17; **reemplaza a SR 11-7 (2011) y SR 21-8 (2021)**. La versión importa:
  # media profesión sigue citando SR 11-7, que está derogada. Verificado en la página del Fed el
  # 2026-08-22; el PDF de la guía completa no se leyó, así que lo que consta es el alcance y la
  # sustitución, no su detalle sobre validación.
  # Nota 2026-09-24 (documentado por fuente secundaria, no verificado contra el PDF oficial
  # `SR2602a1.pdf`, que no se dejó leer como texto en esta corrida): Sullivan & Cromwell, memo del
  # 17/04/2026, cita literal que la guía "excludes generative and agentic AI models from its scope,
  # on the basis that these technologies are 'novel and rapidly evolving'", dejándolas bajo las
  # prácticas generales de gestión de riesgo de la organización y no bajo este marco de gobierno de
  # modelos. Es además del punto ya registrado sobre la exclusión de motores de reglas de la
  # definición de "modelo".
  - name: Federal Reserve SR 26-2 — Revised Guidance on Model Risk Management
    url: https://www.federalreserve.gov/supervisionreg/srletters/SR2602.htm
    tier: regulation
    topics: [model-risk, validation, governance, outcomes-analysis]
  # Del mismo día que SR 26-2 y su contraparte OCC. Define «modelo» como método cuantitativo
  # complejo y **excluye** los procesos determinísticos basados en reglas: un motor de reglas de
  # fraude no es un modelo bajo esa definición, y eso cambia qué gobierno le aplica.
  # Misma nota que en la entrada de SR 26-2, de arriba (2026-09-24, documentado por fuente
  # secundaria, no verificado contra el original): la guía excluye también a la IA generativa y
  # agéntica de su alcance.
  - name: OCC Bulletin 2026-13 — Model Risk Management, Revised Guidance
    url: https://www.occ.gov/news-issuances/bulletins/2026/bulletin-2026-13.html
    tier: regulation
    topics: [model-definition, rules-engines, model-risk, scope]
  - name: NIST AI Risk Management Framework 1.0 (NIST.AI.100-1)
    url: https://www.nist.gov/itl/ai-risk-management-framework
    tier: standard
    topics: [ai-risk, govern-map-measure-manage, trustworthiness]
  # EBA/GL/2020/01 del 2020-01-22, aplicables desde 2020-07-01; enmiendan a EBA/GL/2018/05. Sirve
  # como vocabulario y taxonomía de fraude en pagos aunque la obligación de reporte no alcance al
  # producto. Verificada la ficha; las plantillas de reporte no se leyeron.
  - name: EBA Guidelines on fraud reporting under PSD2 (EBA/GL/2020/01)
    url: https://www.eba.europa.eu/regulation-and-policy/payment-services-and-electronic-money/guidelines-on-fraud-reporting-under-psd2
    tier: regulation
    topics: [fraud-taxonomy, reporting, payments]
  # 14.ª edición, 2.402 casos en 143 países. Cubre fraude **ocupacional** —el interno, con
  # colusión— y no fraude transaccional externo, que es el grueso del dominio de este cargo. Se
  # registra con ese límite escrito para que no se la cite como si midiera lo otro.
  - name: ACFE — Occupational Fraud 2026, A Report to the Nations
    url: https://www.acfe.com/fraud-resources/report-to-the-nations
    tier: profession
    topics: [occupational-fraud, detection-methods, collusion, red-flags]
  # Segunda edición, 2026-03-16. Dos afirmaciones verificadas contra el comunicado oficial,
  # 2026-09-24: sistemas de "IA agéntica" pueden planear y ejecutar campañas de fraude completas
  # —de la investigación del blanco a la extorsión— sin intervención humana en el medio, y el
  # fraude potenciado por IA es "4.5 times more profitable than traditional methods" para quien lo
  # comete. La cifra de USD 442.000 millones en pérdidas de 2025 que citan notas de prensa no se
  # pudo confirmar en el comunicado oficial y no se registra acá. Cambia el actor y el método que
  # la sección "Nombrar el esquema concreto" del flujo de riesgo da por sentados cuando asume un
  # actor humano operando manualmente en cada paso.
  #
  # Actualización 2026-10-24: la cifra de USD 442.000 millones que citan varias notas de prensa no se
  # origina en INTERPOL — se origina en el reporte «Global State of Scams 2025» de la Global
  # Anti-Scam Alliance (GASA), en alianza con Feedzai. La ficha oficial de GASA
  # (gasa.org/knowledge-base/reports/global-state-of-scams-2025, leída directo 2026-10-24) verifica la
  # metodología —encuesta a 46.000 adultos en 42 países— verificado, fuente primaria, página pública—
  # pero no muestra la cifra en el texto público: está detrás de un registro de miembro. La cifra y su
  # encuadre —pérdida estimada por encuesta, no medición transaccional— constan sólo por
  # feedzai.com/blog/gasa-global-state-of-scams-report/ (leído 2026-10-24, el propio socio de GASA en
  # el estudio) — documentado, no verificado contra el texto completo del reporte. Las fechas de
  # publicación también difieren entre fuentes: Feedzai cita 07/10/2025, la metadata de la página
  # oficial de GASA muestra 31/12/2025.
  - name: INTERPOL — Global Financial Fraud Threat Assessment, 2.ª edición
    url: https://www.interpol.int/en/News-and-Events/News/2026/INTERPOL-report-warns-of-increasingly-sophisticated-global-financial-fraud-threat
    tier: profession
    topics: [agentic-fraud, fraud-schemes, actor-and-method, threat-assessment]
  # Consulta abierta el 2026-06-10, cerrada el 2026-07-22, leída directo el 2026-09-24: doce
  # prácticas en tres categorías (gobierno de IA a nivel organización; gestión de riesgo de IA en
  # desarrollo y despliegue; riesgo de ciberseguridad/TI/terceros asociado a IA). No vinculante —la
  # propia página lo dice—. Informe final anunciado para octubre de 2026 como entregable del G20:
  # revisar en el próximo ciclo de aprendizaje, no antes.
  - name: FSB — consulta "Sound Practices for the Responsible Adoption of Artificial Intelligence (AI)"
    url: https://www.fsb.org/2026/06/fsb-consults-on-sound-practices-for-the-responsible-adoption-of-artificial-intelligence-ai/
    tier: standard
    topics: [ai-governance, model-risk, third-party-risk, consultation]
  #
  # Documentado por el registro de incidentes de IA de la OCDE (agregador de prensa),
  # oecd.ai/en/incidents/2026-09-25-b291, leído directo el 2026-10-02: en febrero de 2026, Fideuram
  # (Intesa Sanpaolo Private Banking) transfirió ~€95 millones tras un mensaje de WhatsApp que
  # suplantaba al CEO del grupo, seguido de una llamada con voz clonada por IA; entre €36 y €39,5
  # millones sin recuperar según las notas que agrega el registro, que difieren; el cuerpo dice voz
  # clonada de un abogado de confianza y algunos titulares, el CEO del grupo. El mismo registro cita
  # un caso similar contra Banca IFIS (€24 millones, €20 recuperados). Esquema con actor (externo que
  # compromete el canal de comunicación, no el sistema), ganancia (decenas de millones por intento) y
  # ventana (días entre el primer contacto y las transferencias) — documentado, agregador de prensa
  # (Reuters entre ellas) citada en el propio registro.
  - name: OCDE, rastreador de incidentes de IA — caso Fideuram/Intesa Sanpaolo (2026-09-25-b291)
    url: https://oecd.ai/en/incidents/2026-09-25-b291
    tier: profession
    topics: [agentic-impersonation-fraud, authorization-bypass]
  # Verificado contra el comunicado oficial de la policía neerlandesa, leído directo el 2026-10-21: el
  # 06/10/2026 se detuvo a dos sospechosos por un esquema que afectó a unas 170 víctimas en el
  # período en que la policía siguió al grupo (unas tres semanas) por unos €380.000 (~€2.235 por
  # víctima). Mecanismo: una llamada automática reproduce audios generados por IA que simulan voces de
  # «empleados del banco» alertando de movimientos sospechosos;
  # una persona real pide a la víctima que instale una app y acerque su tarjeta al teléfono «para
  # protegerla» — la app lee el chip NFC y transmite los datos a un cómplice que retira en un cajero.
  # Esquema con actor (dos operadores coordinados, uno de voz sintética automatizada y uno en vivo),
  # ganancia (~€2.235 por víctima) y ventana (de la primera llamada al retiro, no precisada por la
  # policía más allá de «rápida») — corroborado por nltimes.nl, dutchnews.nl y ad-hoc-news.de (los
  # tres leídos 2026-10-24), sin contradecir el comunicado. Generaliza, fuera de banca privada
  # ejecutiva, la misma falla que registra el caso Fideuram de arriba: un canal suplantable —acá una
  # llamada con voz sintética— no es una segunda fuente independiente.
  - name: Politie Rotterdam — comunicado sobre fraude de helpdesk bancario con voz IA y relectura NFC
    url: https://www.politie.nl/nieuws/2026/oktober/20/07-twee-verdachten-aangehouden-in-onderzoek-naar-nieuwe-vorm-van-bankhelpdeskfraude.html
    tier: profession
    topics: [ai-voice-phishing, nfc-relay-fraud, authorization-bypass]
  # Reemplaza en estructura —no en vigencia, que no existía— a la entrada de la consulta de arriba.
  # Verificado contra fsb.org/2026/10/fsb-finalises-..., leído directo el 2026-10-24, publicado
  # 15/10/2026. Las doce prácticas de la consulta (tres categorías) pasan a dos: ocho de «ciclo de
  # vida de IA» (materialidad, selección de tecnología, gobierno de datos, explicabilidad y controles
  # compensatorios, desempeño, supervisión humana, ciberseguridad/TI, terceros) y cuatro de «gobierno a
  # nivel organización» (supervisión de directorio, marco con roles definidos, integración al marco de
  # riesgo, aprendizaje continuo) — estructura en dos categorías corroborada además por
  # bankingnewsai.com (16/10/2026, documentado, fuente secundaria). La propia página lo presenta como
  # "a practical toolkit" que cada institución adapta; no crea obligación, y ninguna de las doce prácticas nombra fraude de forma específica: lo que toca a
  # este cargo (explicabilidad, supervisión humana, desempeño) ya está cubierto por las reglas del
  # modelo que `SKILL.md` exige con independencia de cualquier marco externo.
  - name: FSB — informe final "Sound Practices for the Responsible Adoption of Artificial Intelligence (AI)"
    url: https://www.fsb.org/2026/10/fsb-finalises-sound-practices-for-the-responsible-adoption-of-artificial-intelligence-ai/
    tier: standard
    topics: [ai-governance, model-risk, third-party-risk]
  # El Banco de Inglaterra y el FMI advirtieron el 14/10/2026 sobre fraude potenciado por IA —agentes
  # autorreplicantes y estafas con deepfakes— erosionando la confianza en el sistema financiero. El
  # propio rastreador de la OCDE que registra el aviso (oecd.ai/en/incidents/2026-10-14-cacd, leído
  # directo 2026-10-24) lo clasifica como «hazard» (peligro), no como «incident»: es una advertencia
  # institucional sobre daño plausible, no un esquema con actor, ganancia y ventana confirmados. Que
  # BoE y FMI emitieron la advertencia es verificado contra el registro de la OCDE; el contenido de la
  # advertencia en sí consta sólo por agregación de prensa que cita a ambas instituciones, no por
  # comunicado primario de ninguna de las dos — documentado, no verificado. No citar como esquema con
  # evidencia publicada: es el error que R14 nombra al distinguir hipótesis de hecho comprobado.
  - name: OCDE, rastreador de peligros de IA — aviso de BoE/IMF sobre fraude agéntico (2026-10-14-cacd)
    url: https://oecd.ai/en/incidents/2026-10-14-cacd
    tier: standard
    topics: [ai-fraud-systemic-risk]
  # Esta entrada no existía (ver la verificación al inicio de esta sección): se crea acá consolidando
  # las tres corridas que la tocaron, para no perder ninguna.
  #
  # Visa endureció el umbral de «excesivo» de su Programa de Monitoreo de Adquirentes (VAMP), con
  # cronología completa corroborada por chargeflow.io (leído 2026-10-24): 01/04/2025 reemplazo de
  # VDMP/VFMP; abril-septiembre 2025 período de aviso sin penalidad; 01/10/2025 enforcement pleno con
  # umbral de 2,2 %; 01/04/2026 ajuste del umbral a 1,5 % — documentado, fuente secundaria; el fact
  # sheet oficial de VAMP y las Visa Core Rules no se dejaron leer como texto en ninguna de las tres
  # corridas que tocaron este tema. El hallazgo original (2026-09-24, H8) decía sólo «desde el
  # 2026-04-01, de 2,2 % a 1,5 %», que mezclaba las dos fases en una sola fecha; esta entrada usa la
  # cronología de cuatro fechas en su lugar. Un resultado de búsqueda agregado de la corrida del
  # 2026-10-24 confundió además el año del enforcement pleno (dijo 01/10/2026 en vez de 01/10/2025) —
  # mismo patrón de error que ya registra, más abajo en este archivo, la nota sobre la «CFPB Circular
  # 2026-03» inexistente: no citar el enforcement sin la fecha completa. «Compelling Evidence 3.0»
  # permite retirar del cálculo tanto el reporte de fraude (TC40) como la disputa (TC15) cuando el
  # comercio demuestra que el mismo titular ya recibió el bien o servicio en una transacción previa no
  # disputada — documentado, fuente secundaria (Forter), sin verificación primaria.
  #
  # Ventana de respuesta a una disputa: las Visa Core Rules fijan 30 días por fase (dispute,
  # pre-arbitraje, reversa) y Mastercard 45 días — documentado, tres fuentes secundarias convergentes
  # (Chargeflow, Seamlesschex, PaymentBrief, leídas 2026-10-02) más chargebacks911.com (06/03/2026,
  # leído 2026-10-24), sin acceso al texto primario (el PDF de Visa Core Rules devuelve HTTP 404 al
  # fetch automatizado en las tres corridas). Pero la documentación oficial de un procesador grande,
  # Adyen (docs.adyen.com/risk-management/understanding-disputes/dispute-timeframes, leído directo
  # 2026-10-24), dice que desde el 21/07/2025, para disputas de Visa, el plazo de respuesta en
  # pagos procesados localmente en EE. UU. y Canadá es de 9 días, y de 18 en el resto de las regiones — documentado,
  # documentación oficial de un procesador, no de la red de pagos. Para Visa, la ventana con ese
  # procesador es de 9/18 días, no de 30; para Mastercard la misma página no da un plazo de respuesta
  # equivalente. Es el tipo de cambio que mueve el costo del error que el paso 5 del
  # flujo de riesgo pide tener en cuenta.
  #
  # Esta entrada es sobre el umbral de disputas y las ventanas de respuesta a una disputa ya
  # presentada. No es el mecanismo de reparto de responsabilidad por falta de autenticación fuerte
  # (3-D Secure/SCA bajo el RTS de PSD2) cuando el pago nunca se autenticó: ése es un mecanismo
  # distinto, sin fuente registrada en este archivo.
  - name: Visa VAMP (Visa Acquirer Monitoring Program) y ventanas de respuesta a disputas Visa/Mastercard
    url: https://chargeflow.io/blog/what-are-visas-new-vamp-rules-a-2025-guide-for-merchants
    tier: profession
    topics: [card-network-rules, chargeback-window, dispute-liability]
  # Visa describe en su propia página corporativa (sin fecha explícita visible, corroborada por
  # prensa del 20 y 21/11/2025 — digitalcommerce360.com y paymentsdive.com) una red de sitios web
  # fraudulentos que incrustan un agente conversacional de IA haciéndose pasar por soporte al cliente,
  # para retrasar que la víctima contacte a su banco real y mantenerla «comprometida durante días o
  # semanas». Citado explícitamente como afirmación de la propia Visa sobre su propio hallazgo, no
  # como medición independiente de este cargo — Visa cuantifica ~USD 1.000 millones en transacciones
  # de estafa detectadas en la segunda mitad de 2025 como categoría agregada, no específica de este
  # esquema. El agente de IA no ataca el sistema de pago: opera como un canal de atención legítimo,
  # con intención ilegítima — encaja en la delimitación de este cargo frente a Security Engineer que
  # ya escribe `SKILL.md`.
  - name: Visa — red de sitios fraudulentos con agente de IA incrustado como soporte falso
    url: https://corporate.visa.com/en/sites/visa-perspectives/security-trust/the-threats-landscape-of-agentic-commerce.html
    tier: profession
    topics: [agentic-commerce-fraud]

# Lo que se buscó y **no** quedó registrado, con el motivo. Sin esta lista, la próxima corrida
# repite la búsqueda y concluye que no existe:
#
# - Banco Central do Brasil, Resolução Conjunta nº 6 (compartilhamento de dados de fraude): la
#   página del normativo se sirve por JavaScript y no devuelve texto legible, así que no se pudo
#   leer ni el título ni su articulado. Es directamente aplicable a la operación brasileña y
#   queda pendiente de verificar contra el diario oficial.
#   Actualización 2026-09-24: el alcance (instituciones financieras y de pago) y la vigencia
#   (01/11/2023) ya están corroborados por fuentes secundarias (TaxesBrasil, Mattos Filho, Grant
#   Thornton) — documentado, no verificado contra fuente primaria—. Lo que sigue faltando es el
#   articulado; la página oficial sigue sin devolver texto legible al fetch automatizado.
#   Actualización 2026-10-02: tres fuentes secundarias independientes (Grant Thornton, Migalhas,
#   LegisWeb, las tres leídas 2026-10-02) coinciden en mecánica adicional — plazo de 24 horas para
#   compartir indicios de fraude desde que se identifican, por un sistema electrónico, con
#   consentimiento LGPD del cliente para compartir la información — documentado, no verificado
#   contra el diario oficial; la página del BCB sigue sin devolver texto legible al fetch
#   automatizado.
# - Reg E (12 CFR 1005.11) y Reg B (12 CFR 1002.9) en eCFR: el sitio responde con una página de
#   verificación de acceso a toda petición automatizada. Sin texto leído, no se registran.
# - ISO 31000:2018 (gestión del riesgo): iso.org devuelve 403. Sin ficha legible, no se registra.
# - Marco de Basilea, capítulo OPE25 (categorías de evento de pérdida, incluidos fraude interno y
#   externo): la página de bis.org se arma por JavaScript y no devolvió las definiciones.
# - FFIEC, «Authentication and Access to Financial Institution Services and Systems» (2021):
#   ffiec.gov devuelve 403.
