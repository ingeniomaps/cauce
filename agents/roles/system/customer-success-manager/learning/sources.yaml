version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/customer-success-manager.md dentro de cada instalación.
sources:
  - name: ISO 10001
    url: https://www.iso.org/standard/71579.html
    tier: standard
    topics: [customer-promises, codes-of-conduct]
  - name: ISO 10002
    url: https://www.iso.org/standard/71580.html
    tier: standard
    topics: [complaints, handling, improvement]
  - name: ISO 10004
    url: https://www.iso.org/standard/71582.html
    tier: standard
    topics: [customer-satisfaction, monitoring, measurement]
  - name: Gainsight Customer Success Guide
    url: https://www.gainsight.com/guides/the-essential-guide-to-customer-success/
    tier: platform
    topics: [outcomes, onboarding, adoption, health, risk]
