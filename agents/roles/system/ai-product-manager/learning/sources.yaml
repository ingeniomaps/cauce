version: 1
rules:
  require_primary_source: true
  require_model_provider_version_date_status_and_use_case_fit: true
  require_reproducible_evidence_and_affected_user_input: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false
# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/ai-product-manager.md dentro de cada instalación.
sources:
  - {name: NIST AI RMF 1.0 and status, url: "https://www.nist.gov/itl/ai-risk-management-framework", tier: standard, topics: [ai-risk, lifecycle, status, monitoring]}
  - {name: NIST Generative AI Profile AI 600-1, url: "https://www.nist.gov/itl/ai-risk-management-framework/ai-risk-management-framework-resources", tier: standard, topics: [generative-ai, risk, evaluation]}
  - {name: ISO IEC 42001 AI management systems, url: "https://www.iso.org/standard/42001", tier: standard, topics: [ai-management, governance, improvement]}
  - {name: OECD AI Principles, url: "https://www.oecd.org/en/topics/ai-principles.html", tier: standard, topics: [rights, transparency, robustness, accountability, sustainability]}
