version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false
# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/engineering-manager.md dentro de cada instalación.
sources:
  - name: DORA Capabilities
    url: https://dora.dev/capabilities/
    tier: profession
    topics: [delivery, culture, feedback, performance]
  - name: SPACE Framework
    url: https://queue.acm.org/detail.cfm?id=3454124
    tier: profession
    topics: [developer-productivity, wellbeing, flow, collaboration]
  - name: Google re Work team effectiveness
    url: https://rework.withgoogle.com/intl/en/guides/understanding-team-effectiveness
    tier: profession
    topics: [psychological-safety, effectiveness]
  - name: ACM Code of Ethics
    url: https://www.acm.org/code-of-ethics
    tier: profession
    topics: [ethics, fairness, privacy, leadership]
