version: 1
rules:
  require_primary_source: true
  require_version_and_environment: true
  require_product_evidence_for_capability_claims: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false
# El contexto de la empresa no es una fuente de la profesión: vive en
# organization/roles/solutions-engineer.md dentro de cada instalación.
sources:
  - name: ISO IEC IEEE 42010 architecture description
    url: https://www.iso.org/standard/74393.html
    tier: standard
    topics: [architecture, concerns, viewpoints, decisions]
  - name: ISO IEC 25010 product quality model
    url: https://www.iso.org/standard/78176.html
    tier: standard
    topics: [quality, requirements, evaluation, acceptance]
  - name: NIST Cybersecurity Framework 2.0
    url: https://www.nist.gov/publications/nist-cybersecurity-framework-csf-20
    tier: standard
    topics: [cybersecurity, risk, governance, profiles]
  - name: OpenAPI Specification
    url: https://spec.openapis.org/oas/latest.html
    tier: standard
    topics: [api, contracts, compatibility, tooling]
