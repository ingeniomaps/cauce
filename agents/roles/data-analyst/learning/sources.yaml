version: 1
rules:
  require_primary_source: true
  require_version_applicability: true
  require_corroboration_for_major_change: true
  reject_unsourced_claims: true
  automatic_apply: false

sources:
  - name: Company metric catalog schemas models lineage and decisions
    url: local://analytics-context
    tier: company-primary
    topics: [metrics, schemas, lineage, quality, decisions]
  - name: Official data platform and BI documentation
    url: local://analytics-stack-docs
    tier: platform-primary
    topics: [sql, semantics, performance, visualization]
  - name: NIST Statistical Methods Handbook
    url: https://www.itl.nist.gov/div898/handbook/
    tier: primary-method
    topics: [statistics, exploration, uncertainty, modeling]
  - name: ASA Ethical Guidelines
    url: https://www.amstat.org/your-career/ethical-guidelines-for-statistical-practice
    tier: professional-primary
    topics: [ethics, transparency, communication, data]
  - name: UK Reproducible Analytical Pipelines
    url: https://analysisfunction.civilservice.gov.uk/support/reproducible-analytical-pipelines/
    tier: government-primary
    topics: [reproducibility, automation, testing]
  - name: Eurostat Quality Assurance
    url: https://ec.europa.eu/eurostat/web/quality/european-quality-standards/european-statistics-code-of-practice
    tier: government-primary
    topics: [quality, methodology, coherence, timeliness]
